# Publishes the real game (GitHub Pages, source = "GitHub Actions"): main branch -> https://beermarkus-tech.github.io/Space-Miner/
# The test version (frontier branch) is published separately to the Space-Miner-Dev project (tools/publish-dev.sh on frontier),
# because an installed app owns its address and everything below it. If a run fails, the site keeps the last good version.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the real game (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Put the website together
        run: |
          EXCL="--exclude=.git --exclude=.github --exclude=tests --exclude=CLAUDE.md"
          mkdir -p _site
          rsync -a $EXCL main/ _site/
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
