<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ore Rush DEV</title>
<meta name="theme-color" content="#03040a">
<meta name="description" content="Ore Rush: a deep-space mining shooter. Blast asteroids, collect ore, fight pirates, upgrade your ship.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/dev-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ore Rush DEV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#5ef0ff;--amber:#ffc845;--red:#ff5a5a;--panel:rgba(8,12,26,.84);--line:rgba(94,240,255,.28)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#03040a;color:#dfe9ff;font-family:"Exo 2",system-ui,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;inset:0}
  #topbtns{position:fixed;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  #topbtns button,#actbtns button{border-radius:10px;border:1px solid var(--line);background:rgba(8,12,26,.62);color:#cfefff;cursor:pointer;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #topbtns button{width:38px;height:38px;font-size:15px}
  body.paused #topbtns{z-index:11}
  #actbtns{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:5}
  body.playing #actbtns{display:flex}
  #actbtns button{height:44px;padding:0 12px;font-family:Orbitron;font-weight:700;font-size:11px;letter-spacing:.06em;display:flex;align-items:center;gap:7px;touch-action:manipulation;white-space:nowrap}
  #actbtns .wd{width:10px;height:10px;border-radius:50%}
  #bombBtn{border-color:rgba(199,125,255,.5)!important}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;padding:14px;
    background:radial-gradient(ellipse at center,rgba(3,5,14,.35),rgba(3,5,14,.82))}
  .ov.show{display:flex}
  .panel{width:min(680px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:20px 20px 18px;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(94,240,255,.08);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:pan-y}
  h1,h2,h3{font-family:Orbitron,sans-serif;margin:0;letter-spacing:.06em}
  h1{font-size:clamp(38px,11vw,72px);font-weight:900;text-align:center;line-height:1;
    background:linear-gradient(180deg,#fff 0%,#9ff6ff 45%,#ffb347 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(94,240,255,.35))}
  h2{font-size:21px;color:var(--cyan);margin-bottom:8px}
  .kicker{font-family:Orbitron;font-size:11px;letter-spacing:.3em;color:#8fb6c9;margin-bottom:4px}
  .sub{text-align:center;font-family:Orbitron;font-size:12px;letter-spacing:.4em;color:#8fb6c9;margin:10px 0 20px}
  p{line-height:1.5;margin:8px 0;color:#c8d6ef}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .btn{font-family:Orbitron;font-weight:700;letter-spacing:.08em;font-size:15px;padding:14px 18px;border-radius:12px;cursor:pointer;
    border:1px solid rgba(94,240,255,.55);color:#03121a;background:linear-gradient(180deg,#8ff8ff,#2fc6e0);box-shadow:0 0 20px rgba(94,240,255,.3)}
  .btn.alt{background:transparent;color:#cfefff;border-color:var(--line);box-shadow:none}
  .btn.warn{background:linear-gradient(180deg,#ffd27a,#ff9a3c);border-color:#ffb347}
  .btn:disabled{opacity:.35;cursor:default}
  .help{font-size:13px;color:#93a8c6;text-align:center;margin-top:16px;line-height:1.6}
  .radio{border-left:3px solid var(--amber);padding:8px 12px;background:rgba(255,200,69,.06);border-radius:0 10px 10px 0;margin:12px 0}
  .radio b{font-family:Orbitron;font-size:11px;letter-spacing:.2em;color:var(--amber);display:block;margin-bottom:4px}
  .obj{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(94,240,255,.05);margin:10px 0}
  .obj .ic{font-size:20px}
  .obj b{font-family:Orbitron;font-size:12px;letter-spacing:.12em;color:var(--cyan);display:block}
  .credits{font-family:Orbitron;color:var(--amber);font-weight:700}
  .rows{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:12px 0;font-size:15px}
  .rows .v{text-align:right;font-family:Orbitron;font-size:14px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700}
  .stars{font-size:34px;text-align:center;letter-spacing:8px;margin:6px 0}
  .stars .on{color:var(--amber);text-shadow:0 0 14px rgba(255,200,69,.7)}.stars .off{color:rgba(255,255,255,.15)}
  .starlist{font-size:12.5px;color:#93a8c6;text-align:center}
  .shophead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
  .tabs button{flex:1;font-family:Orbitron;font-size:11px;font-weight:700;letter-spacing:.04em;padding:10px 6px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#93a8c6;white-space:nowrap}
  .tabs button.on{border-color:var(--cyan);color:var(--cyan);background:rgba(94,240,255,.08)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .card.warn{border-color:rgba(255,90,90,.5);background:rgba(255,90,90,.07)}
  .card.eq{border-color:rgba(94,240,255,.55);background:rgba(94,240,255,.06)}
  .card img{width:100%;height:70px;object-fit:contain}
  .ct{font-family:Orbitron;font-size:13px;font-weight:700;color:#e9f6ff;display:flex;align-items:center;gap:7px}
  .cd{font-size:12.5px;color:#93a8c6;flex:1}
  .pips{display:flex;gap:3px}
  .pip{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
  .pip.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
  .card .bb{display:flex;gap:6px}
  .card button{flex:1;font-family:Orbitron;font-weight:700;font-size:12.5px;padding:9px 6px;border-radius:9px;border:1px solid rgba(255,200,69,.6);
    background:rgba(255,200,69,.12);color:var(--amber);cursor:pointer}
  .card button.eqb{border-color:rgba(94,240,255,.6);background:rgba(94,240,255,.1);color:var(--cyan)}
  .card button:disabled{opacity:.35;cursor:default}
  .stat{font-size:12px;color:#7ff7ff}
  .market{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .mrow{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.03)}
  .mrow.dim{opacity:.55}.mrow .dot{margin:0}.mn{font-weight:600;font-size:14px}.mn small{display:block;font-size:11px;color:#93a8c6;font-weight:400}.mh{color:#9fdcff;font-family:Orbitron;font-size:12px}
  .mp{font-family:Orbitron;font-weight:700;font-size:14px;text-align:right}.mp small{font-size:10px}
  .sellb{font-family:Orbitron;font-weight:700;font-size:11.5px;padding:8px 9px;border-radius:9px;border:1px solid rgba(255,200,69,.6);background:rgba(255,200,69,.12);color:var(--amber);cursor:pointer;white-space:nowrap}
  .loc{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.03);margin:7px 0}
  .loc>div{flex:1;font-size:14px}.loc small{display:block;font-size:12px;color:#93a8c6;margin-top:2px}.loc b{color:#e9f6ff}
  .loc .btn{padding:10px 14px;font-size:13px;flex:none}.loc.next{border-color:rgba(255,200,69,.6);background:rgba(255,200,69,.07)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chip{font-family:Orbitron;font-size:11px;padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:rgba(94,240,255,.05);color:#cfefff;cursor:pointer}
  svg.sysmap{width:100%;height:auto;display:block;margin:6px 0 4px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:radial-gradient(ellipse at center,rgba(40,60,110,.25),rgba(0,0,0,.2));font-family:'Exo 2',sans-serif}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:min(92vw,520px);background:rgba(8,12,26,.94);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:#dfe9ff;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
  #toast.show{opacity:1}
  .syncside{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5;background:rgba(94,240,255,.04)}
  .syncside span{font-size:12.5px;color:#93a8c6}
  input.code1{width:100%;background:rgba(0,0,0,.35);color:#e9f6ff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px 'Exo 2',sans-serif;user-select:text;-webkit-user-select:text;touch-action:auto}
  .belt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
  .card button.deed{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-color:color-mix(in srgb,var(--rc) 55%,transparent);background:rgba(255,255,255,.03);color:#e9f6ff}
  .card button.deed small{font-size:10px;color:#ffc845;font-family:'Exo 2'}
  .card button.deed[data-poor] small{color:#93a8c6}
  .card button.deed.own{background:color-mix(in srgb,var(--rc) 22%,transparent);border-color:var(--rc);opacity:1}
  .card button.deed.own small{color:var(--rc)}
  .card button.deed:disabled:not(.own){opacity:.4}
  textarea.code{width:100%;height:84px;resize:none;background:rgba(0,0,0,.35);color:#9ff6ff;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px ui-monospace,Menlo,monospace;word-break:break-all;touch-action:pan-y;user-select:text;-webkit-user-select:text}
  .row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row2 .btn{flex:1;font-size:13px;padding:11px 10px}
  .msg{font-size:13px;margin-top:8px;min-height:18px}
  .sbar{display:grid;grid-template-columns:52px 1fr;gap:4px 8px;font-size:11px;color:#93a8c6;align-items:center}
  .sbar i{height:5px;border-radius:3px;background:linear-gradient(90deg,#2fc6e0,#8ff8ff);display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="topbtns"><button id="pauseBtn" aria-label="Pause">❚❚</button><button id="muteBtn" aria-label="Sound">♪</button><button id="vibeBtn" aria-label="Vibration" style="display:none">📳</button></div>
<div id="actbtns"><button id="wpnBtn"><span class="wd" id="wpnDot"></span><span id="wpnName">BLASTER</span></button><button id="bombBtn">✸ NOVA <span id="bombN">0</span></button></div>
<div id="ov" class="ov"></div>
<script>
'use strict';
// Build number, shown in the main menu. Bump it together with VERSION in sw.js on every push.
// DEV = the test version on the frontier branch (published at /dev/). It keeps its own saves and settings (keys start with dev_),
// its own cloud Gist and app icon. When frontier becomes the real game: set DEV=false, restore manifest/icons/sw names, continue BUILD from main.
const DEV=true,BUILD=1;
const KP=DEV?'dev_':'';   // prefix for every localStorage key
// ================= helpers =================
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const mod=(a,n)=>((a%n)+n)%n;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function shade(h,amt){const n=parseInt(h.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);
  r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return `rgb(${r},${g},${b})`}
const store={get(k){try{return JSON.parse(localStorage.getItem(KP+k))}catch(e){return null}},set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(KP+k)}catch(e){}}};
const fmt=n=>Math.round(n).toLocaleString();

// ================= canvas =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=1,SW=0,SH=0,ZOOM=1;
const radarSize=()=>Math.min(SW,SH)<500?108:146;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);SW=innerWidth;SH=innerHeight;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  cv.style.width=SW+'px';cv.style.height=SH+'px';ZOOM=clamp(Math.min(SW,SH)/640,0.55,1.15);
  document.getElementById('topbtns').style.right=(radarSize()+24)+'px'}
addEventListener('resize',resize);

// ================= sprites =================
const glowCache={};
function glow(color){if(glowCache[color])return glowCache[color];const s=64,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,hexA(color,1));gr.addColorStop(.4,hexA(color,.3));gr.addColorStop(1,hexA(color,0));
  g.fillStyle=gr;g.fillRect(0,0,s,s);return glowCache[color]=c}
function glowOn(g,x,y,r,color,a){g.globalAlpha=a;g.drawImage(glow(color),x-r,y-r,r*2,r*2);g.globalAlpha=1}
const drawGlow=(x,y,r,c,a)=>glowOn(ctx,x,y,r,c,a);

const TYPES={
  rock:{name:'Scrap',light:'#a29b93',base:'#5f5a55',dark:'#1c1a18',vein:null,ore:'#d6d0c8',val:4,hard:1},
  iron:{name:'Iron',light:'#ad7f66',base:'#6a4434',dark:'#1c100b',vein:'#ff8a3d',ore:'#ff9a4d',val:12,hard:1.3},
  ice:{name:'Ice',light:'#eaf8ff',base:'#8fb8d0',dark:'#1d3346',vein:'#c8f6ff',ore:'#cdf6ff',val:18,hard:.8},
  gold:{name:'Gold',light:'#a59a80',base:'#5c5442',dark:'#191710',vein:'#ffd84a',ore:'#ffe066',val:30,hard:1.7},
  crystal:{name:'Crystal',light:'#8296b0',base:'#3c4a5e',dark:'#0d121a',vein:'#4ff3ff',ore:'#8ff8ff',val:70,hard:2.2},
  plasma:{name:'Plasmite',light:'#a483b4',base:'#4d3359',dark:'#140a19',vein:'#ff4fd8',ore:'#ff86e6',val:160,hard:3},
  void:{name:'Voidstone',light:'#5a5f8a',base:'#22244a',dark:'#05050f',vein:'#c9a2ff',ore:'#dcc2ff',val:320,hard:3.6},
  cryo:{name:'Cryonite',light:'#d8f4ff',base:'#4f86a8',dark:'#081626',vein:'#7dffe0',ore:'#9dffe8',val:600,hard:4.2}
};
const TYPE_KEYS=Object.keys(TYPES);
const PAL_VOLATILE={light:'#9a5a48',base:'#4a2a22',dark:'#120605',vein:'#ff3b1f'};

function smoothPath(g,pts){const n=pts.length;g.beginPath();g.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}g.closePath()}

function asteroidSprite(r,P,dense){
  const k=Math.min(2.2,DPR*ZOOM)+.15,pad=6,size=Math.ceil((r+pad)*2*k);
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');g.scale(k,k);g.translate(r+pad,r+pad);
  const n=10+Math.floor(r/5),pts=[];
  for(let i=0;i<n;i++){const a=i/n*TAU+rand(-.12,.12),rr=r*rand(dense?.86:.76,1);pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
  g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=8;smoothPath(g,pts);g.fillStyle=P.dark;g.fill();g.restore();
  g.save();smoothPath(g,pts);g.clip();
  const light=dense?'#8a93a3':P.light,base=dense?'#30343c':P.base,dark=dense?'#07080a':P.dark;
  const bg=g.createRadialGradient(-r*.4,-r*.45,r*.05,-r*.1,-r*.1,r*1.3);bg.addColorStop(0,light);bg.addColorStop(.45,base);bg.addColorStop(1,dark);
  g.fillStyle=bg;g.fillRect(-r-pad,-r-pad,(r+pad)*2,(r+pad)*2);
  for(let i=0;i<r*4;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.13)';g.beginPath();g.arc(rand(-r,r),rand(-r,r),rand(.6,r*.1),0,TAU);g.fill()}
  if(dense){g.strokeStyle='rgba(200,215,235,.18)';g.lineWidth=1.4;for(let i=0;i<5;i++){g.beginPath();g.moveTo(rand(-r,r),rand(-r,r));g.lineTo(rand(-r,r),rand(-r,r));g.stroke()}}
  const nc=1+Math.floor(r/11);
  for(let i=0;i<nc;i++){const cx=rand(-r*.55,r*.55),cy=rand(-r*.55,r*.55),cr=rand(r*.08,r*.24);
    const cg=g.createRadialGradient(cx+cr*.25,cy+cr*.25,0,cx,cy,cr);cg.addColorStop(0,'rgba(0,0,0,.55)');cg.addColorStop(.8,'rgba(0,0,0,.25)');cg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=cg;g.beginPath();g.arc(cx,cy,cr,0,TAU);g.fill();
    g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=Math.max(.8,cr*.14);g.beginPath();g.arc(cx,cy,cr*.92,Math.PI*.05,Math.PI*.95);g.stroke()}
  if(P.vein){const nv=2+Math.floor(r/7);
    for(let i=0;i<nv;i++){const vx=rand(-r*.65,r*.65),vy=rand(-r*.65,r*.65);if(vx*vx+vy*vy>r*r*.5)continue;const vs=rand(2.5,Math.max(3,r*.13));
      g.globalCompositeOperation='lighter';g.globalAlpha=.55;g.drawImage(glow(P.vein),vx-vs*3,vy-vs*3,vs*6,vs*6);g.globalAlpha=1;g.globalCompositeOperation='source-over';
      g.save();g.translate(vx,vy);g.rotate(rand(0,TAU));g.fillStyle=P.vein;g.beginPath();g.moveTo(0,-vs);g.lineTo(vs*.7,0);g.lineTo(0,vs);g.lineTo(-vs*.7,0);g.closePath();g.fill();
      g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.moveTo(0,-vs*.7);g.lineTo(vs*.3,-vs*.1);g.lineTo(-vs*.2,0);g.closePath();g.fill();g.restore()}}
  const sh=g.createRadialGradient(-r*.5,-r*.5,r*.2,-r*.2,-r*.2,r*1.6);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.55,'rgba(0,0,0,.2)');sh.addColorStop(1,'rgba(0,0,0,.75)');
  g.fillStyle=sh;g.fillRect(-r-pad,-r-pad,(r+pad)*2,(r+pad)*2);g.restore();
  g.save();smoothPath(g,pts);g.clip();g.strokeStyle=dense?'rgba(220,235,255,.35)':'rgba(255,255,255,.18)';g.lineWidth=2;g.translate(1.2,1.2);smoothPath(g,pts);g.stroke();g.restore();
  return {c,size:(r+pad)*2,off:r+pad}
}

function makeNebula(hue,dim){const T=1024,c=document.createElement('canvas');c.width=c.height=T;const g=c.getContext('2d');
  g.fillStyle='#04050c';g.fillRect(0,0,T,T);g.globalCompositeOperation='lighter';
  for(let i=0;i<34;i++){const x=Math.random()*T,y=Math.random()*T,r=rand(90,340),h=hue+rand(-45,45),col=`hsla(${h},75%,45%,`;

function weaponDps(id){const L=wl[id];if(L<0)return 0;const s=wstat(id,L),r=S.rateMul||1;let d;

// deterministic random numbers (same galaxy and prices for a given seed and day)
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const hashf=s=>hashStr((fr?fr.seed:0)+'|'+s)/4294967296;
function srand(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}

const getSys=id=>HOME[id]||(fr&&fr.gen[id]);
const sysLinks=id=>[...((HOME[id]&&HOME[id].links)||(fr.gen[id]&&fr.gen[id].links)||[]),...(fr.links[id]||[])];
const frontierOpen=()=>homeProgress()>LAST_SECTOR;
const homeProgress=()=>inFlight?homeLevel:level;
// can the gate into this system be used yet?
function sysUnlocked(id){const s=getSys(id);if(!s)return false;if(HOME[id])return homeProgress()>s.r*10;return frontierOpen()}
function lockText(id){const s=getSys(id);return HOME[id]?`Gate opens after sector ${s.r*10}`:`Gate opens after sector ${LAST_SECTOR}`}
// difficulty of a system's side jobs
function sysN(id){const s=getSys(id);if(HOME[id])return clamp(homeProgress()-1,s.r*10+1,s.r*10+10);return LAST_SECTOR+s.depth*4}

// generated systems: created next to the Frozen Halo and next to every generated system you visit
function genNeighbors(id){if(!frontierOpen()||fr.done[id])return;const s=getSys(id);if(!s||(HOME[id]&&id!=='frozen'))return;
  const R=srand(hashStr(fr.seed+'gen'+id)),k=HOME[id]?2:1+Math.floor(R()*2.2),all=()=>[...HOME_SYS,...Object.values(fr.gen)];
  for(let i=0;i<k;i++){let x,y,t=0;do{const a=-1.2+R()*2.4,d=1+R()*.6;x=s.x+Math.cos(a)*d;y=s.y+Math.sin(a)*d;t++}while(all().some(o=>Math.hypot(o.x-x,o.y-y)<.75)&&t<25);
    const nid='g'+(Object.keys(fr.gen).length+1),depth=(s.depth||0)+1,produce=[pick(['iron','gold','ice','crystal']),pick(['plasma','void','cryo'])];
    const mul={};for(const k2 of TYPE_KEYS)mul[k2]=+(produce.includes(k2)?.55+R()*.25:.8+R()*.9).toFixed(2);
    const name=GEN_A[Math.floor(R()*GEN_A.length)]+GEN_B[Math.floor(R()*GEN_B.length)];
    fr.gen[nid]={id:nid,name,station:name.split(' ')[0].replace(/[’']s$/,'')+' '+GEN_ST[Math.floor(R()*GEN_ST.length)],x,y,depth,hue:Math.floor(R()*360),mul,links:[id]};
    (fr.links[id]=fr.links[id]||[]).push(nid);
    // sometimes connect to another nearby system too, so routes can loop
    for(const o of Object.values(fr.gen))if(o.id!==nid&&o.id!==id&&Math.hypot(o.x-x,o.y-y)<1.25&&R()<.5&&!sysLinks(nid).includes(o.id)){fr.gen[nid].links.push(o.id);(fr.links[o.id]=fr.links[o.id]||[]).push(nid);break}}
  fr.done[id]=true}

// ---- market ----
const cargoUsed=()=>Object.values(fr.cargo).reduce((a,b)=>a+b,0);
const cargoCap=()=>Math.round((S.sh.cap||60)*(1+.2*(upg.cargo||0))*(1+OC_GAIN.cargo*(oc.cargo||0)));
const holdRoom=()=>cargoCap()-cargoUsed();
function sysEvent(id,day){const b=Math.floor(day/3),h=hashf(id+'ev'+b);if(h>.38)return null;
  const k=TYPE_KEYS[Math.floor(hashf(id+'evk'+b)*TYPE_KEYS.length)],up=hashf(id+'evu'+b)<.65;return{k,up,f:up?1.6:.6}}
function priceOf(id,k,day){day=day||fr.day;const s=getSys(id);let m=(s.mul&&s.mul[k])||1;
  m*=1+.12*(hashf(id+k+day)*2-1);const ev=sysEvent(id,day);if(ev&&ev.k===k)m*=ev.f;
  m/=1+((fr.sat[id]||{})[k]||0)/80;return Math.max(1,Math.round(TYPES[k].val*m*S.refine))}
function newsFor(id){const s=getSys(id),ev=sysEvent(id,fr.day);
  if(ev){const N=TYPES[ev.k].name;return ev.up?pick([`${N} shortage on ${s.station}! They pay a lot more for a few days.`,`Somebody at ${s.station} sneezed on the ${N} supply. Prices are way up.`,`${s.station} is desperate for ${N}. Name your price (well, almost).`])
    :pick([`Too much ${N} on ${s.station}. Prices crashed. Sell it somewhere else.`,`A freighter dumped a mountain of ${N} here. Nobody wants more for a few days.`])}
  return pick(['Quiet day. The coffee machine is broken again.','Rumour: a pilot found a talking asteroid. Probably just Dave.','Pirates were spotted near the gate. As usual.',
    'The station cat has been promoted to Head of Security.','Somebody keeps hearing a humming from the Frozen Halo. Management says: no, you don’t.','Fuel prices stable. Pilot jokes still terrible.'])}
function rememberPrices(id){const p={};for(const k of TYPE_KEYS)p[k]=priceOf(id,k);fr.known[id]={day:fr.day,p}}
function bestElsewhere(k){let best=null;for(const[id,kn]of Object.entries(fr.known)){if(id===fr.sys||!getSys(id))continue;const v=kn.p[k];if(v&&(!best||v>best.v))best={v,id,day:kn.day}}return best}
// sell: the price drops a little with every unit sold here
function sellOre(k,all){let units=fr.cargo[k]||0;if(units<=0)return 0;let total=0;const sat=fr.sat[fr.sys]=fr.sat[fr.sys]||{};
  while(units>1e-6){const u=Math.min(1,units);total+=priceOf(fr.sys,k)*u;sat[k]=(sat[k]||0)+u;units-=u}
  delete fr.cargo[k];total=Math.round(total);credits+=total;score+=total;if(!all){sfx.buy();saveGame()}return total}
function sellAll(){let t=0;for(const k of Object.keys(fr.cargo))t+=sellOre(k,true);if(t){sfx.clear();saveGame();toast(`Sold everything for ${fmt(t)} cr`)}return t}
const fuelPrice=()=>20+homeProgress()*4;

// ---- side jobs (change every day) ----
function sideJobs(id){const n=sysN(id),R=srand(hashStr(fr.seed+'jobs'+id+fr.day)),k=HOME[id]?2:3,jobs=[];
  const pool=['clear','clear',...(n>=4?['quota']:[]),...(n>=8?['defend']:[]),...(n>=9?['lode','lode']:[]),...(n>=13?['escort']:[]),...(n>=16?['storm']:[]),...(!HOME[id]?['boss']:[])];
  for(let i=0;i<k;i++){const m=pool[Math.floor(R()*pool.length)],place=PLACES[Math.floor(R()*PLACES.length)];
    jobs.push({kind:'side',id:id+'-'+fr.day+'-'+i,mission:m,n,name:`${MISSION_NAME[m]}: ${place}`,boss:m==='boss'?BOSSES[Math.floor(R()*BOSSES.length)]:null,hue:getSys(id).hue})}
  return jobs}
function storyLoc(n){return{kind:'story',n,mission:missionOf(n),name:'Sector '+n,boss:null}}

// ---- flights ----
function startFlight(loc){cur=loc;if(!inFlight){homeLevel=level;inFlight=true}level=loc.n;startLevel()}
function endFlight(){if(inFlight){level=homeLevel;inFlight=false}exitGate=null}
const curBoss=()=>cur&&cur.boss||bossOf(level);
function openExitGate(){if(!ship)return;const a=Math.atan2(-ship.y,-ship.x)+rand(-.6,.6),d=380,lim=HALF-160;
  exitGate={x:clamp(ship.x+Math.cos(a)*d,-lim,lim),y:clamp(ship.y+Math.sin(a)*d,-lim,lim),r:48,t:0};addPart({k:'ring',x:exitGate.x,y:exitGate.y,vx:0,vy:0,life:.8,max:.8,size:120,color:'#7fe8ff'})}
function drawExitGate(t){const g=exitGate;ctx.save();ctx.translate(g.x,g.y);ctx.globalCompositeOperation='lighter';drawGlow(0,0,120,'#7fe8ff',.3+.1*Math.sin(t*.006));
  ctx.rotate(t*.0015);ctx.strokeStyle='rgba(127,232,255,.9)';ctx.lineWidth=5;ctx.setLineDash([24,12]);ctx.beginPath();ctx.arc(0,0,58,0,TAU);ctx.stroke();
  ctx.rotate(-t*.003);ctx.strokeStyle='rgba(199,125,255,.7)';ctx.lineWidth=2.5;ctx.setLineDash([10,9]);ctx.beginPath();ctx.arc(0,0,40,0,TAU);ctx.stroke();ctx.setLineDash([]);
  drawGlow(0,0,36,'#e0fbff',.7);ctx.restore()}
// arrows at the screen edge pointing at what matters right now
function arrowTargets(){const T=[],near=list=>{let b=null,bd=1e9;for(const o of list){const d=Math.hypot(o.x-ship.x,o.y-ship.y);if(d<bd){bd=d;b=o}}return b};
  if(!ship||ship.dead)return T;
  if(exitGate){T.push([exitGate,'#7fe8ff','EXIT']);return T}if(clearT>=0||failT>=0)return T;
  if(mission==='clear'){const g=near(asteroids.filter(a=>a.goal));if(g)T.push([g,'#ffd84a','']);}
  if(['clear','ambush','quota','storm','lode'].includes(mission)){const e=near(enemies);if(e)T.push([e,'#ff5a5a',''])}
  if(mission==='boss'){const b=enemies.find(e=>e.boss);if(b)T.push([b,'#ff5a5a','BOSS'])}
  if((mission==='escort'||mission==='defend')&&rig&&!rig.dead)T.push([rig,'#7fe8ff',mission==='escort'?'HAULER':'RIG']);
  if(mission==='lode'&&lode&&!lode.dead)T.push([lode,'#ffd84a','LODE']);
  if(mission==='storm'&&storm&&storm.out)T.push([{x:storm.cx,y:storm.cy},'#c9b3ff','SAFE']);
  return T}
function drawArrows(){const L=30,Tp=Math.min(SW,SH)<500?150:120,Rr=SW-30,B=SH-92,cx=SW/2,cy=(Tp+B)/2;
  for(const[o,col,label]of arrowTargets()){const sx=SW/2+(o.x-cam.x)*ZOOM,sy=SH/2+(o.y-cam.y)*ZOOM;if(sx>L&&sx<Rr&&sy>Tp&&sy<B)continue;
    const dx=sx-cx,dy=sy-cy,k=Math.min(dx?((dx>0?Rr:L)-cx)/dx:1e9,dy?((dy>0?B:Tp)-cy)/dy:1e9),x=cx+dx*k,y=cy+dy*k,a=Math.atan2(dy,dx);
    ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-7,-8);ctx.lineTo(-3,0);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();ctx.restore();
    if(label){ctx.font='700 9px Orbitron';ctx.textAlign='center';ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.fillText(label,x-Math.cos(a)*22,y-Math.sin(a)*22+3);ctx.globalAlpha=1}}}

// ---- jumps ----
function jumpTo(id){if(!sysLinks(fr.sys).includes(id))return;if(!sysUnlocked(id))return toast(lockText(id));
  if(fr.fuel<1)return toast('Out of fuel. Buy some at the station.');
  fr.fuel--;fr.day++;for(const s of Object.values(fr.sat))for(const k in s){s[k]*=.7;if(s[k]<.5)delete s[k]}
  fr.sys=id;if(!fr.visited.includes(id))fr.visited.push(id);genNeighbors(id);sfx.jump();saveGame();
  const r=Math.random(),s=getSys(id),n=sysN(id);
  if(r<.2&&homeProgress()>3){state='event';showOv(`<div class="kicker">ARRIVING · ${s.name.toUpperCase()}</div><h2 style="color:#ff7a5a">⚠ Pirate ambush!</h2>
      <p>${pick(['A pirate gang was waiting at the gate. Their leader says: “Nice cargo. Hand it over.”','Pirates! They have a banner that says WELCOME. It is a trap.','Three pirate ships drop out of nowhere. One of them is painted pink, which is somehow worse.'])}</p>
      <div class="btns"><button class="btn warn" data-act="ambushFight">Fight them</button>${cargoUsed()>0?`<button class="btn alt" data-act="ambushPay">Hand over 25% of your cargo</button>`:''}</div>`);return}
  if(r<.32){const k=bestType(n),amt=Math.min(holdRoom(),Math.round(rand(4,10)));state='event';
    showOv(`<div class="kicker">ARRIVING · ${s.name.toUpperCase()}</div><h2>Drifting wreck</h2><p>${pick(['You find an abandoned freighter. The captain’s log just says “never again”.','A wreck tumbles past the gate. Its cargo bay is still sealed.','Somebody left a cargo pod here with a note: “finders keepers”.'])}</p>
      ${amt>0?`<p>Salvage: <b style="color:${TYPES[k].ore}">${amt} ${TYPES[k].name}</b></p><div class="btns"><button class="btn" data-act="salvage" data-k="${k}" data-v="${amt}">Take it</button><button class="btn alt" data-act="sysmap">Leave it</button></div>`
        :`<p>Your hold is full, so you leave it.</p><div class="btns"><button class="btn" data-act="sysmap">Continue</button></div>`}`);return}
  toast(`Arrived at ${s.name} · day ${fr.day}`);showSystem()}

// ---- screens ----
const holdBar=()=>{const u=cargoUsed(),c=cargoCap();return`<span>Cargo</span><span class="v" style="color:${u>=c?'#ff7a5a':'inherit'}">${Math.floor(u)} / ${c}</span>`};
function showStation(){state='station';const id=fr.sys,s=getSys(id);rememberPrices(id);computeStats();
  const rows=TYPE_KEYS.map(k=>{const T=TYPES[k],have=fr.cargo[k]||0,p=priceOf(id,k),rel=p/(T.val*S.refine),b=bestElsewhere(k);
    if(!have&&!fr.visited.length)return'';
    return`<div class="mrow ${have?'':'dim'}"><i class="dot" style="background:${T.ore};box-shadow:0 0 8px ${T.ore}"></i><div class="mn">${T.name}${have?` <span class="mh">× ${Math.floor(have)}</span>`:''}
      ${b?`<small>best seen: ${fmt(b.v)} at ${getSys(b.id).station}${b.day<fr.day?` (day ${b.day})`:''}</small>`:''}</div>
      <div class="mp" style="color:${rel>1.15?'#7dff7a':rel<.85?'#ff7a5a':'#ffc845'}">${fmt(p)}<small> cr${rel>1.15?' ▲':rel<.85?' ▼':''}</small></div>
      ${have?`<button class="sellb" data-act="sell" data-k="${k}">Sell ${fmt(Math.round(p*have))}</button>`:'<span></span>'}</div>`}).join('');
  const total=Object.keys(fr.cargo).reduce((a,k)=>a+priceOf(id,k)*fr.cargo[k],0);
  showOv(`<div class="kicker">${s.name.toUpperCase()} · DAY ${fr.day}</div><h2>${s.station}</h2>
    <div class="row2"><button class="btn" data-act="undock">🚀 Undock</button><button class="btn alt" data-act="shop">🛠 Shipyard</button></div>
    ${fr.fuel<FUEL_MAX?`<div class="row2"><button class="btn alt" data-act="refuel" ${credits<fuelPrice()?'disabled':''}>⛽ Refuel ${FUEL_MAX-fr.fuel} jump${FUEL_MAX-fr.fuel>1?'s':''} · ${fmt(fuelPrice()*(FUEL_MAX-fr.fuel))} cr</button></div>`:''}
    <div class="radio"><b>STATION NEWS</b>${fr.news===fr.day*1000+hashStr(id)%997?fr.newsTxt:(fr.newsTxt=newsFor(id),fr.news=fr.day*1000+hashStr(id)%997,fr.newsTxt)}</div>
    <div class="rows"><span>Credits</span><span class="v credits">${fmt(credits)} cr</span>${holdBar()}<span>Fuel</span><span class="v">${fr.fuel} / ${FUEL_MAX}</span>
    <span>Hull</span><span class="v" style="color:${hull<S.hullMax*.5?'#ff7a5a':'inherit'}">${Math.round(hull)} / ${S.hullMax}</span></div>
    <div class="kicker" style="margin-top:6px">MARKET · PRICES PER UNIT</div><div class="market">${rows}</div>
    ${cargoUsed()>0?`<div class="btns" style="margin-top:10px"><button class="btn" data-act="sellall">Sell everything · ${fmt(Math.round(total))} cr</button></div>`:''}
    <div class="btns"><button class="btn alt" data-act="menu">Main menu</button></div>
    <div class="help">▲ pays more than usual here · ▼ pays less. Selling a lot of one ore lowers its price here for a few days.</div>`)}
function sysSvg(id){const s=getSys(id),W=340,H=190,cx=W/2,cy=H/2+4,col=`hsl(${s.hue},80%,65%)`;let g='';
  g+=`<circle cx="${cx}" cy="${cy}" r="14" fill="hsl(${s.hue},90%,70%)" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="30" fill="hsl(${s.hue},90%,60%)" opacity=".15"/>`;
  for(const r of [52,78])g+=`<ellipse cx="${cx}" cy="${cy}" rx="${r*1.9}" ry="${r}" fill="none" stroke="rgba(255,255,255,.08)"/>`;
  g+=`<g><rect x="${cx-118}" y="${cy-46}" width="22" height="22" rx="4" fill="#2a3a52" stroke="#5ef0ff"/><text x="${cx-107}" y="${cy-14}" fill="#9fdcff" font-size="9" text-anchor="middle">STATION</text></g>`;
  g+=`<g><circle cx="${cx+122}" cy="${cy-30}" r="11" fill="none" stroke="#7fe8ff" stroke-width="3" stroke-dasharray="6 4"/><text x="${cx+122}" y="${cy-8}" fill="#9fdcff" font-size="9" text-anchor="middle">GATE</text></g>`;
  if(HOME[id])for(let i=0;i<10;i++){const sn=s.r*10+i+1,a=Math.PI*.15+i/9*Math.PI*.95,x=cx+Math.cos(a)*150,y=cy+Math.sin(a)*70,done=sn<homeProgress(),next=sn===homeProgress();
    g+=`<circle cx="${x}" cy="${y}" r="${next?8:6}" fill="${done?col:next?'#ffc845':'#202838'}" stroke="${next?'#fff':'rgba(255,255,255,.25)'}"/><text x="${x}" y="${y+3}" fill="${done||next?'#03121a':'#6a7890'}" font-size="7" text-anchor="middle" font-weight="700">${sn}</text>`}
  return`<svg viewBox="0 0 ${W} ${H}" class="sysmap" aria-hidden="true">${g}</svg>`}
function showSystem(){state='sysmap';const id=fr.sys,s=getSys(id),p=homeProgress();setupFieldPreview(s);
  let story='';if(HOME[id]){const first=s.r*10+1,last=s.r*10+10;
    if(p>=first&&p<=last){const L=storyLoc(p),o=objFor(p);story+=`<div class="loc next"><div><b>Sector ${p}</b> · ${o[1]}<small>${o[2]}</small></div><button class="btn" data-act="fly" data-loc="story:${p}">Fly</button></div>`}
    else if(p>last)story+=`<div class="loc"><div><b>All sectors of ${s.name} cleared</b><small>Replay them for ore and stars below.</small></div></div>`;
    const done=[];for(let n=first;n<=Math.min(last,p-1);n++)done.push(`<button class="chip" data-act="fly" data-loc="story:${n}">${n} ${'★'.repeat(stars[n]||0)}</button>`);
    if(done.length)story+=`<div class="chips">${done.join('')}</div>`}
  const jobs=sideJobs(id).map(j=>`<div class="loc"><div><b>${j.name}</b><small>${objFor(j.n,j)[2]} Danger level ${j.n}.</small></div><button class="btn alt" data-act="fly" data-loc="side:${j.id}">Fly</button></div>`).join('');
  showOv(`<div class="kicker">${s.name.toUpperCase()} · DAY ${fr.day} · FUEL ${fr.fuel}/${FUEL_MAX} · CARGO ${Math.floor(cargoUsed())}/${cargoCap()}</div><h2>${s.name}</h2>${sysSvg(id)}
    <div class="loc"><div><b>${s.station}</b><small>Sell cargo, refuel, shipyard.</small></div><button class="btn alt" data-act="dock">Dock</button></div>
    ${story?`<div class="kicker" style="margin-top:12px">STORY</div>${story}`:''}
    <div class="kicker" style="margin-top:12px">JOBS TODAY</div>${jobs}
    <div class="loc"><div><b>Jump gate</b><small>Travel to other star systems (1 fuel per jump, 1 day passes).</small></div><button class="btn alt" data-act="galaxy">Galaxy map</button></div>`)}
function galaxyNear(){const seen=new Set([fr.sys]),q=[[fr.sys,0]];while(q.length){const[id,d]=q.shift();if(d>=3)continue;for(const l of sysLinks(id))if(!seen.has(l)&&getSys(l)&&(fr.visited.includes(l)||fr.visited.includes(id))){seen.add(l);q.push([l,d+1])}}return[...seen]}
function showGalaxy(){state='galaxy';genNeighbors(fr.sys);const ids=galaxyNear(),sys=ids.map(getSys),W=340,H=220,pad=34;
  const xs=sys.map(s=>s.x),ys=sys.map(s=>s.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),k=Math.min((W-2*pad)/Math.max(.5,x1-x0),(H-2*pad)/Math.max(.5,y1-y0),120);
  const P=s=>[W/2+(s.x-(x0+x1)/2)*k,H/2+(s.y-(y0+y1)/2)*k];let g='';const drawn=new Set();
  for(const s of sys)for(const l of sysLinks(s.id)){if(!ids.includes(l))continue;const key=[s.id,l].sort().join();if(drawn.has(key))continue;drawn.add(key);const[a,b]=[P(s),P(getSys(l))],open=sysUnlocked(s.id)&&sysUnlocked(l);
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${open?'rgba(127,232,255,.45)':'rgba(255,90,90,.35)'}" stroke-width="2" ${open?'':'stroke-dasharray="5 5"'}/>`}
  for(const s of sys){const[x,y]=P(s),here=s.id===fr.sys,vis=fr.visited.includes(s.id);
    g+=`<circle cx="${x}" cy="${y}" r="${here?11:8}" fill="hsl(${s.hue},85%,${vis?62:35}%)" stroke="${here?'#fff':'none'}" stroke-width="2"/>${here?`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="#fff" stroke-opacity=".4"/>`:''}
      <text x="${x}" y="${y+22}" fill="${vis?'#cfe0f5':'#6a7890'}" font-size="9.5" text-anchor="middle">${vis?s.name:'Uncharted'}</text>`}
  const cards=sysLinks(fr.sys).filter(getSys).map(l=>{const s=getSys(l),open=sysUnlocked(l),kn=fr.known[l],vis=fr.visited.includes(l);
    const pays=kn?TYPE_KEYS.map(k=>[k,kn.p[k]/TYPES[k].val]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>TYPES[k].name).join(', '):'';
    return`<div class="loc"><div><b>${vis?s.name:'Uncharted system'}</b><small>${!open?lockText(l):vis?(pays?`Pays well for: ${pays} (seen day ${kn.day})`:'Visited'):'Nobody knows what’s out there.'}${!HOME[l]?` · danger ${sysN(l)}`:''}</small></div>
      <button class="btn ${open?'':'alt'}" data-act="jump" data-id="${l}" ${open&&fr.fuel>=1?'':'disabled'}>Jump</button></div>`}).join('');
  showOv(`<div class="kicker">GALAXY MAP · DAY ${fr.day} · FUEL ${fr.fuel}/${FUEL_MAX}</div><h2>Jump gate · ${getSys(fr.sys).name}</h2>
    <svg viewBox="0 0 ${W} ${H}" class="sysmap" aria-hidden="true">${g}</svg>${cards}
    ${fr.fuel<1?'<p style="color:#ff7a5a">Out of fuel. Dock at the station to refuel.</p>':''}

// ================= level setup =================
const TIER_R=[0,20,36,60];
function makeAsteroid(x,y,tier,type,vx,vy,kind='rock'){const n=level,T=TYPES[type];let r=TIER_R[tier]*rand(.9,1.1);
  if(kind==='cache')r=17;
  let hp=(r/7)*T.hard*(1+n*.045);if(kind==='dense')hp*=2.6;if(kind==='volatile')hp*=.7;if(kind==='cache')hp=7+n*.7;
  const P=kind==='volatile'?PAL_VOLATILE:T;
  return{x,y,vx,vy,a:rand(0,TAU),va:rand(-.9,.9)/tier,r,tier,type,kind,hp,maxhp:hp,flash:0,spr:kind==='cache'?null:asteroidSprite(r,P,kind==='dense')}}
function typeWeights(n){return[['rock',n<11?3:n<21?1.6:.8],['iron',n<21?2.5:1],['gold',n>=2?Math.min(3,n-1):0],['ice',n>=6?1.3:0],['crystal',n>=4?Math.min(3,(n-3)*.6):0],
  ['plasma',n>=11?Math.min(2.6,(n-10)*.5):0],['void',n>=21?Math.min(2.2,(n-20)*.4):0],['cryo',n>=31?Math.min(2,(n-30)*.35):0]]}
function pickType(n){const w=typeWeights(n);
  let t=w.reduce((s,x)=>s+x[1],0),r=Math.random()*t;for(const[k,v]of w){r-=v;if(r<=0)return k}return 'rock'}
function bestType(n){return n>=31?pick(['cryo','void','plasma']):n>=21?pick(['void','plasma','crystal']):n>=11?pick(['plasma','crystal','gold']):n>=4?pick(['crystal','gold']):'gold'}
function randomSpot(minD){let x,y,t=0;do{x=rand(-HALF+90,HALF-90);y=rand(-HALF+90,HALF-90);t++}while(Math.hypot(x,y)<minD&&t<60);return[x,y]}
function spawnRandomAsteroid(tier,atEdge){const n=level;let x,y;
  if(atEdge&&ship&&WORLD>3000){const a=rand(0,TAU),d=rand(700,1050);x=clamp(ship.x+Math.cos(a)*d,-HALF+90,HALF-90);y=clamp(ship.y+Math.sin(a)*d,-HALF+90,HALF-90)}
  else if(atEdge){let t=0;do{const s=Math.floor(Math.random()*4),p=rand(-HALF+80,HALF-80),e=HALF-80;[x,y]=[[p,-e],[e,p],[p,e],[-e,p]][s];t++}while(ship&&Math.hypot(x-ship.x,y-ship.y)<450&&t<20)}
  else if(clusters.length){let t=0;do{const c=pick(clusters),a=rand(0,TAU),d=Math.sqrt(Math.random())*420;x=c.x+Math.cos(a)*d;y=c.y+Math.sin(a)*d;t++}while((Math.abs(x)>HALF-90||Math.abs(y)>HALF-90||Math.hypot(x,y)<360)&&t<30);
    x=clamp(x,-HALF+90,HALF-90);y=clamp(y,-HALF+90,HALF-90)}
  else[x,y]=randomSpot(360);
  const type=pickType(n);let kind='rock';const rv=Math.random();
  if(tier>=2){if(n>=8&&rv<(n>=11?.17:.07))kind='volatile';else if(n>=12&&rv<.32)kind='dense'}
  const a=rand(0,TAU),sp=rand(18,55)*(1+n*.025)*(1+(3-tier)*.4)*(type==='ice'?1.9:1);
  const ast=makeAsteroid(x,y,tier,type,Math.cos(a)*sp,Math.sin(a)*sp,kind);asteroids.push(ast);
  if(atEdge){addPart({k:'ring',x,y,vx:0,vy:0,life:.6,max:.6,size:ast.r*2,color:'#9ff6ff'})}return ast}

function buildSpawnQueue(n,m){const q=[];
  if(n>=3)for(let i=0;i<Math.min(8,Math.floor((n-1)/2.5));i++)q.push('drone');
  if(n>=7)for(let i=0;i<Math.min(6,Math.floor((n-4)/3));i++)q.push('kamikaze');
  if(n>=11)for(let i=0;i<Math.min(5,Math.floor((n-8)/3));i++)q.push('gunship');
  if(n>=14)for(let i=0;i<Math.min(3,Math.floor((n-10)/4));i++)q.push('minelayer');
  if(n>=31)for(let i=0;i<Math.min(4,Math.floor((n-28)/3));i++)q.push('sniper');
  if(n>=33)for(let i=0;i<Math.min(3,Math.floor((n-30)/4));i++)q.push('medic');
  for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
  let cap=m==='boss'?Math.min(5,Math.floor(n/5)):m==='quota'||m==='storm'?Math.min(8,q.length):m==='lode'?6:14;return q.slice(0,cap)}
const enemyPool=n=>['drone','drone',...(n>=7?['kamikaze','kamikaze']:[]),...(n>=11?['gunship']:[]),...(n>=14?['minelayer']:[]),...(n>=31?['sniper']:[]),...(n>=33?['medic']:[])];

function setupField(n,withShip){
  const m0=withShip&&cur?cur.mission:'clear';
  WORLD=m0==='boss'?Math.min(2800,1800+n*55):m0==='ambush'?2600:Math.min(5000,3200+n*45);HALF=WORLD/2;clusters=[];
  asteroids=[];bullets=[];ebullets=[];missiles=[];enemies=[];ores=[];pus=[];mines=[];holes=[];blasts=[];arcs=[];parts=[];texts=[];rig=null;beam=null;storm=null;lode=null;frost=[];stolen=0;
  const R=REGIONS[regionOf(n)],hue=(withShip&&cur&&cur.hue!=null?cur.hue:R.hues[n%5])+rand(-10,10);nebula=makeNebula(hue,R.dim);planet=makePlanet((hue+150)%360);planetPos={x:rand(.6,.85),y:rand(.18,.4)};
  mission=withShip?(cur?cur.mission:missionOf(n)):'clear';
  {const kc=3+Math.floor(WORLD/1600);for(let i=0;i<kc;i++){const[x,y]=randomSpot(450);clusters.push({x,y})}}
  const sc=WORLD>3000?1.5:1;let big,med;
  if(mission==='boss'){big=Math.min(8,3+Math.floor(n/4));med=2}
  else if(mission==='quota'){big=Math.min(12,6+Math.floor(n/4));med=3}
  else if(mission==='defend'||mission==='escort'){big=Math.min(9,4+Math.floor(n/5));med=2}
  else if(mission==='storm'){big=Math.min(12,6+Math.floor(n/4));med=3}
  else if(mission==='lode'){big=Math.min(8,3+Math.floor(n/5));med=2}
  else if(mission==='ambush'){big=2;med=3}
  else{big=n<=10?Math.min(13,3+Math.floor(n*.95)):Math.min(16,7+Math.floor(n*.35));med=Math.min(8,Math.floor(n/2))}
  if(mission!=='boss'&&mission!=='ambush'){big=Math.round(big*sc);med=Math.round(med*sc)}
  for(let i=0;i<big;i++){const a=spawnRandomAsteroid(3);if(mission==='clear'&&withShip)a.goal=true}for(let i=0;i<med;i++)spawnRandomAsteroid(2);
  if(n>=3&&Math.random()<.65||n>=15){const[x,y]=randomSpot(400);asteroids.push(makeAsteroid(x,y,1,'gold',rand(-30,30),rand(-30,30),'cache'))}
  const epath=mission==='escort'?escortPath():null,offPath=(x,y)=>!epath||epath.every((q,i)=>!i||segDist(x,y,epath[i-1][0],epath[i-1][1],q[0],q[1])>380);
  const nh=n>=21?2:n>=13?1:0;for(let i=0;i<nh;i++){let x,y,t=0;do{[x,y]=randomSpot(560);t++}while((holes.some(h=>Math.hypot(h.x-x,h.y-y)<700)||!offPath(x,y))&&t<40);holes.push({x,y,core:30,range:430,rot:rand(0,TAU)})}
  // Frozen Halo: frost clouds that slow your ship
  if(regionOf(n)===3||(n>LAST_SECTOR&&Math.random()<.4)){const k=2+(Math.random()<.5?1:0);for(let i=0;i<k;i++){let x,y,t=0;do{[x,y]=randomSpot(380);t++}while(frost.some(f=>Math.hypot(f.x-x,f.y-y)<560)&&t<30);frost.push({x,y,r:rand(200,290),t:rand(0,TAU)})}}
  if(withShip){
    spawnQ=mission==='defend'||mission==='escort'?[]:buildSpawnQueue(n,mission);spawnT=rand(5,8);
    if(mission==='boss')enemies.push(makeEnemy(curBoss(),0,-HALF*.62));
    if(mission==='ambush'){spawnQ=[];const k=Math.min(8,3+Math.floor(n/6));for(let i=0;i<k;i++)spawnQ.push(pick(enemyPool(n).filter(e=>e!=='minelayer')));spawnT=1.2}
    if(mission==='quota'){quota=quotaOf(n);quotaGot=0;missionT=100;refillT=0}
    if(mission==='defend'){missionT=defendTime(n);const hp=320+n*22;rig={x:0,y:0,r:42,hp,maxhp:hp,oreT:2.5};spawnT=6}
    if(mission==='escort'){let total=0;for(let i=1;i<epath.length;i++)total+=Math.hypot(epath[i][0]-epath[i-1][0],epath[i][1]-epath[i-1][1]);const hp=360+n*24;
      rig={x:epath[0][0],y:epath[0][1],r:34,hp,maxhp:hp,hauler:true,path:epath,wi:1,a:Math.atan2(epath[1][1]-epath[0][1],epath[1][0]-epath[0][0]),spd:total/escortTime(n),done:0,total,flash:0};spawnT=5;
      asteroids=asteroids.filter(a=>Math.hypot(a.x-rig.x,a.y-rig.y)>a.r+230)}
    if(mission==='storm'){missionT=stormTime(n);refillT=0;const a=rand(0,TAU),dd=rand(0,HALF*.35);
      storm={total:missionT,cx:0,cy:0,tx:Math.cos(a)*dd,ty:Math.sin(a)*dd,r0:HALF*1.45,r1:Math.max(240,HALF*.28),r:HALF*1.45,strikeT:3,warn:[],out:false}}
    if(mission==='lode'){lode=makeLode();asteroids.push(lode);scavT=6}
  }
  ship=withShip?{x:0,y:mission==='defend'?150:0,vx:0,vy:0,a:-Math.PI/2,thrusting:false,fireT:0,missT:1.5,inv:2,dead:false,respawn:0,lastHit:9,contactT:0,shieldFlash:0,
    pu:{rapid:0,over:0,magnet:0,double:0},chill:0,combo:0,comboT:0,wings:[{x:0,y:0,fireT:.5},{x:0,y:0,fireT:.8}]}:null;
  if(ship)[ship.x,ship.y]=spawnPos();cam.x=ship?ship.x:0;cam.y=ship?ship.y:0;levelTime=0;clearT=-1;exitGate=null;failT=-1;shake=0;banner=null}

function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy||1,t=clamp(((px-ax)*vx+(py-ay)*vy)/l2,0,1);return Math.hypot(px-ax-vx*t,py-ay-vy*t)}
// escort route: from one side of the field to a jump gate on the other, with two bends
function escortPath(){const dir=Math.random()<.5?1:-1,yy=()=>rand(-HALF*.5,HALF*.5);return[[-dir*(HALF-170),yy()],[-dir*HALF*.33,yy()],[dir*HALF*.33,yy()],[dir*(HALF-170),yy()]]}
// where the ship (re)appears for each mission type
function spawnPos(){if(rig&&rig.hauler)return[rig.x,clamp(rig.y+110,-HALF+40,HALF-40)];if(rig)return[0,150];if(storm)return[storm.cx,storm.cy];if(lode)return[0,290];return[0,0]}
// Mother Lode: one giant asteroid with three shells; each shell drips ore as you damage it and bursts when it cracks
const LODE_R=[150,118,86];
function lodeLayer(a,L){const n=level;a.layer=L;a.r=LODE_R[L];a.type=L===0?'iron':L===1?(n>=21?'plasma':'gold'):bestType(n);
  a.hp=a.maxhp=(90+n*9)*[1,1.25,1.6][L];a.chip=0;a.spr=asteroidSprite(a.r,TYPES[a.type],L===0)}
function makeLode(){const a={x:0,y:0,vx:0,vy:0,a:0,va:.05,tier:3,kind:'lode',flash:0};lodeLayer(a,0);return a}
function oreBurst(x,y,r,type,k){for(let i=0;i<k;i++){const an=rand(0,TAU),sp=rand(70,190);ores.push({x:x+Math.cos(an)*r,y:y+Math.sin(an)*r,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,type,t:0,a:rand(0,TAU),va:rand(-4,4)})}}
function crackLode(a){const n=level,T=TYPES[a.type];explode(a.x,a.y,a.r*.8,T.vein||'#ffb070');shake=Math.max(shake,18);sfx.crack();buzz([50,40,90],'lode',300);
  oreBurst(a.x,a.y,a.r+8,a.type,10+a.layer*5);
  for(let i=0;i<3;i++){const an=rand(0,TAU),sp=rand(60,120);asteroids.push(makeAsteroid(a.x+Math.cos(an)*(a.r+40),a.y+Math.sin(an)*(a.r+40),2,a.type,Math.cos(an)*sp,Math.sin(an)*sp))}
  if(a.layer<2){lodeLayer(a,a.layer+1);floatText(a.x,a.y-a.r-24,'SHELL CRACKED','#ffd84a',22);return}
  a.dead=true;if(levelStats)levelStats.rocks++;for(let i=0;i<4;i++)setTimeout(()=>explode(a.x+rand(-60,60),a.y+rand(-60,60),70,T.vein||'#ffd84a'),i*130);
  oreBurst(a.x,a.y,20,bestType(n),30);floatText(a.x,a.y-40,'MOTHER LODE!','#ffd84a',26);
  enemies.forEach(e=>{if(!e.dead)killEnemy(e)});winLevel()}

function startLevel(){computeStats();shield=S.shieldMax;hull=Math.min(hull,S.hullMax);
  levelStats={cash:0,lost:0,ore:{},oreVal:{},earned:0,rocks:0,kills:0,damaged:false,deaths:0,bonus:0};TYPE_KEYS.forEach(k=>{levelStats.ore[k]=0;levelStats.oreVal[k]=0});
  setupField(level,true);state='play';hideOv();sfx.warp();if(mission==='boss')setTimeout(()=>{if(state==='play')sfx.bossIntro()},700);document.body.classList.add('playing');updateActBtns()}

function makeEnemy(kind,x,y){const n=level,b={kind,x,y,vx:0,vy:0,a:Math.PI/2,flash:0,t:rand(0,9),orbit:Math.random()<.5?1:-1,fireT:rand(1.2,2.5),isEnemy:true,
  tgt:(mission==='defend'||mission==='escort')&&rig&&Math.random()<.55?'rig':'ship'};
  const fin=n===30||n===LAST_SECTOR?1.6:1;

function addPart(p){if(parts.length<800)parts.push(p)}
function explode(x,y,r,color){
  if(r>=20&&ship&&!ship.dead&&Math.hypot(ship.x-x,ship.y-y)<380)buzz(Math.round(Math.min(45,r*.45)),'x',110);
  addPart({k:'flash',x,y,vx:0,vy:0,life:.35,max:.35,size:r*2.6,color:'#ffd9a0'});
  addPart({k:'ring',x,y,vx:0,vy:0,life:.5,max:.5,size:r*2.2,color});
  const ns=Math.min(46,10+r*.7);for(let i=0;i<ns;i++){const a=rand(0,TAU),sp=rand(40,r*6+80);
    addPart({k:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.3,.8),max:.8,size:rand(3,7),color:Math.random()<.5?color:'#ffb066',drag:2.2})}
  const nm=Math.min(14,3+r/5);for(let i=0;i<nm;i++){const a=rand(0,TAU),sp=rand(10,60);
    addPart({k:'smoke',x:x+rand(-r,r)*.4,y:y+rand(-r,r)*.4,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.8,1.6),max:1.6,size:rand(r*.25,r*.6),drag:1})}
  const nd=Math.min(12,2+r/6);for(let i=0;i<nd;i++){const a=rand(0,TAU),sp=rand(50,180);
    addPart({k:'debris',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.8,1.6),max:1.6,size:rand(2,r*.14+2),rot:rand(0,TAU),vr:rand(-8,8),drag:.8,color:'#3a3632'})}}
function sparks(x,y,n,color,sp=150){for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(sp*.3,sp);addPart({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.15,.35),max:.35,size:rand(2.5,5),color,drag:3})}}
function spawnOre(x,y,type){const a=rand(0,TAU),sp=rand(20,110);ores.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,type,t:0,a:rand(0,TAU),va:rand(-4,4)})}
function spawnPU(x,y,type){if(!type){let t=PU_W.reduce((s,x)=>s+x[1],0),r=Math.random()*t;for(const[k,v]of PU_W){r-=v;if(r<=0){type=k;break}}}
  pus.push({x,y,vx:rand(-50,50),vy:rand(-50,50),type,t:0})}
function floatText(x,y,txt,color,size=15){texts.push({x,y,txt,color,t:0,size})}

function breakAsteroid(a,noDrop){if(a.kind==='lode')return crackLode(a);const T=TYPES[a.type];a.dead=true;
  explode(a.x,a.y,a.r,a.kind==='volatile'?'#ff5a1f':a.kind==='cache'?'#ffd84a':T.vein||'#ffb070');
  if(levelStats)levelStats.rocks++;sfx.boom(a.tier===3);shake=Math.max(shake,a.tier*2.5);if(noDrop)return;
  if(a.kind==='cache'){spawnPU(a.x,a.y);for(let i=0;i<5;i++)spawnOre(a.x,a.y,bestType(level));floatText(a.x,a.y-20,'CACHE!','#ffd84a',18);return}
  if(a.kind==='volatile'){blasts.push({x:a.x,y:a.y,r:125,t:.12});spawnOre(a.x,a.y,'rock');return}
  if(a.tier>1){const n=a.type==='ice'?3:a.tier===3?3:2;for(let i=0;i<n;i++){const an=i/n*TAU+rand(-.5,.5),sp=rand(40,105)*(a.type==='ice'?1.5:1);
    asteroids.push(makeAsteroid(a.x+Math.cos(an)*a.r*.35,a.y+Math.sin(an)*a.r*.35,a.tier-1,a.type,a.vx*.5+Math.cos(an)*sp,a.vy*.5+Math.sin(an)*sp,a.kind==='dense'?'dense':'rock'))}}
  let drops=a.tier===1?2+(Math.random()<.5?1:0):a.tier===2?1+(Math.random()<.4?1:0):1;if(a.kind==='dense')drops*=2;
  for(let i=0;i<drops;i++)spawnOre(a.x,a.y,a.type);

function killEnemy(e){e.dead=true;const boss=e.boss;explode(e.x,e.y,boss?110:e.r*1.7,'#ff5a3c');
  if(boss){for(let i=0;i<5;i++)setTimeout(()=>explode(e.x+rand(-70,70),e.y+rand(-70,70),60,'#ffb347'),i*140)}
  sfx.boom(true);shake=Math.max(shake,boss?24:6);if(levelStats)levelStats.kills++;
  const drops={drone:3,gunship:5,kamikaze:1,minelayer:4,swarmer:Math.random()<.4?1:0,sniper:4,medic:3,scav:1,pylon:2}[e.kind]??28;
  if(e.bag)for(const ty of e.bag)spawnOre(e.x,e.y,ty);

  for(let i=0;i<drops;i++)spawnOre(e.x,e.y,boss?bestType(level):pick(['gold','iron',level>=11?'crystal':'gold']));
  const pc={drone:.12,gunship:.3,kamikaze:.05,minelayer:.25,swarmer:.03,sniper:.25,medic:.3,scav:.1,pylon:.15}[e.kind];
  if(boss){spawnPU(e.x,e.y);spawnPU(e.x,e.y);const bonus=Math.round(300+level*45);credits+=bonus;score+=bonus;if(levelStats){levelStats.earned+=bonus;levelStats.bonus+=bonus}
    floatText(e.x,e.y-40,BOSS_NAME[e.kind]+' DOWN +'+bonus,'#ffc845',24);ebullets=[]}

function hurt(d,quiet){if(!ship||ship.dead||ship.inv>0)return;ship.lastHit=0;
  if(shield>0){const ab=Math.min(shield,d);shield-=ab;d-=ab;ship.shieldFlash=1;if(shield<=0&&!quiet){sfx.shieldDown();buzz([30,30,30],'sd',300)}}
  if(d>0){hull-=d;levelStats.damaged=true;if(!quiet){sfx.hurt();buzz(Math.round(Math.min(60,20+d*1.5)),'h',120)}}else if(!quiet){sfx.shield();buzz(12,'s',150)}
  if(!quiet)shake=Math.max(shake,6);if(hull<=0){hull=0;die()}}
function die(){if(fr&&cargoUsed()>0){let lost=0;for(const k in fr.cargo){const l=fr.cargo[k]*.3;fr.cargo[k]-=l;lost+=l;if(fr.cargo[k]<.01)delete fr.cargo[k]}levelStats.lost+=lost;floatText(ship.x,ship.y-30,'CARGO LOST','#ff7a5a',16)}
  ship.dead=true;ship.respawn=2.6;lives--;levelStats.deaths++;explode(ship.x,ship.y,70,'#5ef0ff');sfx.boom(true);sfx.lost();buzz([90,50,160],'die',500);shake=25;laserSound(false);beam=null}
function hurtRig(d){if(!rig||rig.dead||failT>=0||clearT>=0)return;rig.hp-=d;rig.flash=1;if(rig.hp<=0){rig.hp=0;explode(rig.x,rig.y,120,'#ffc845');sfx.boom(true);shake=26;failLevel(rig.hauler?'The hauler was destroyed.':'The mining rig was destroyed.');rig.dead=true}}

function damageRock(a,d,hx,hy){if(a.dead)return;a.hp-=d;a.flash=1;sfx.hit();const T=TYPES[a.type];
  if(Math.random()<.7)for(let i=0;i<2;i++){const an=Math.atan2(hy-a.y,hx-a.x)+rand(-.8,.8),sp=rand(60,180);addPart({k:'spark',x:hx,y:hy,vx:Math.cos(an)*sp+a.vx,vy:Math.sin(an)*sp+a.vy,life:rand(.15,.35),max:.35,size:rand(2.5,5),color:a.kind==='volatile'?'#ff5a1f':T.vein||'#ffcf9a',drag:3})}
  if(a.kind==='lode'){a.chip+=d;const step=a.maxhp/10;while(a.chip>=step){a.chip-=step;oreBurst(hx,hy,4,a.type,1)}if(a.hp<=0)crackLode(a);return}
  if(a.hp<=0)breakAsteroid(a)}
function damageEnemy(e,d){if(e.dead)return;
  if(e.kind==='warden'&&e.shielded){e.flash=.3;if(!thr('shd',350)){sparks(e.x,e.y-e.r*.5,5,'#9ff6ff',140);sfx.deflect()}return}e.hp-=d;e.flash=1;sfx.clang();if(e.hp<=0)killEnemy(e);
  else if(e.boss&&!e.raged&&e.hp<e.maxhp*.4){e.raged=true;sfx.rage();shake=Math.max(shake,12)}}
function hitTarget(t,d,hx,hy){if(t.isEnemy)damageEnemy(t,d);else damageRock(t,d,hx,hy)}
function detonateMine(m,safe){if(m.dead)return;m.dead=true;explode(m.x,m.y,40,'#ff3b3b');sfx.boom(false);
  if(!safe&&ship&&!ship.dead){const d=Math.hypot(ship.x-m.x,ship.y-m.y);if(d<100)hurt((20+level*.5)*(1-d/140))}}
function areaDamage(x,y,rad,dmg,bossMul=1,hurtsShip=0){
  for(const a of asteroids.slice()){if(a.dead)continue;const d=Math.hypot(a.x-x,a.y-y);if(d<rad+a.r*.6)damageRock(a,dmg,a.x,a.y)}
  for(const e of enemies.slice()){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<rad+e.r)damageEnemy(e,dmg*(e.boss?bossMul:1))}
  for(const m of mines){if(!m.dead&&Math.hypot(m.x-x,m.y-y)<rad)detonateMine(m,hurtsShip===0)}
  if(hurtsShip&&ship&&!ship.dead){const d=Math.hypot(ship.x-x,ship.y-y);if(d<rad)hurt(hurtsShip*(1-d/rad)+4)}}

function triggerNova(){if(!ship||ship.dead||bombs<=0||state!=='play')return;bombs--;updateActBtns();const R=540,dmg=40+level*2.2;
  addPart({k:'ring',x:ship.x,y:ship.y,vx:0,vy:0,life:.9,max:.9,size:R,color:'#c77dff'});addPart({k:'ring',x:ship.x,y:ship.y,vx:0,vy:0,life:.7,max:.7,size:R*.7,color:'#ffffff'});

// ================= targeting =================
function nearest(x,y,range,excl,dirA){let best=null,bs=Infinity;
  const consider=o=>{if(o.dead||(excl&&excl.has(o)))return;const d=Math.hypot(o.x-x,o.y-y)-(o.r||0)*.7;if(d>range)return;
    let s=d*(o.isEnemy?.7:1);if(dirA!==undefined){s*=1+.8*(1-Math.cos(angDiff(dirA,Math.atan2(o.y-y,o.x-x))))}if(s<bs){bs=s;best=o}};
  enemies.forEach(consider);asteroids.forEach(consider);return best}
function rayHit(ox,oy,dx,dy,len,o,rr){const cx=o.x-ox,cy=o.y-oy,t=cx*dx+cy*dy;if(t<-rr||t>len+rr)return -1;const p2=cx*cx+cy*cy-t*t;if(p2>rr*rr)return -1;return Math.max(0,t-Math.sqrt(rr*rr-p2))}
function jag(x1,y1,x2,y2){const pts=[[x1,y1]],n=Math.max(3,Math.floor(Math.hypot(x2-x1,y2-y1)/22)),nx=-(y2-y1),ny=x2-x1,l=Math.hypot(nx,ny)||1;
  for(let i=1;i<n;i++){const t=i/n,o=rand(-10,10);pts.push([x1+(x2-x1)*t+nx/l*o,y1+(y2-y1)*t+ny/l*o])}pts.push([x2,y2]);return pts}

// ================= update: ship & weapons =================
function fireWeapon(dt,firing){const L=wl[weapon],s=wstat(weapon,L),dm=S.dmgMul*(1+OC_WEAPON*(oc['w_'+weapon]||0))*(ship.pu.over>0?2:1),rm=S.rateMul*(ship.pu.rapid>0?2:1);
  const nx=Math.cos(ship.a),ny=Math.sin(ship.a),ox=ship.x+nx*(S.sh.len-2),oy=ship.y+ny*(S.sh.len-2);
  if(weapon==='laser'){if(!firing){beam=null;laserSound(false);return}laserSound(true);
    const dps=s.dps*dm*(ship.pu.rapid>0?1.5:1);let end=s.len,hitObj=null;const hits=[];
    for(const o of [...asteroids,...enemies]){if(o.dead)continue;const t=rayHit(ox,oy,nx,ny,s.len,o,o.isEnemy?o.r:o.r*.88);if(t>=0)hits.push([t,o])}
    for(const m of mines){if(!m.dead){const t=rayHit(ox,oy,nx,ny,s.len,m,12);if(t>=0)hits.push([t,m])}}
    hits.sort((a,b)=>a[0]-b[0]);
    for(const[t,o]of hits){if(o.isMine){if(!s.pierce&&hitObj)break;detonateMine(o,true);continue}const hx=ox+nx*t,hy=oy+ny*t;hitTarget(o,dps*dt,hx,hy);
      if(!hitObj){hitObj=o;if(!s.pierce){end=t;break}}}
    beam={x1:ox,y1:oy,x2:ox+nx*end,y2:oy+ny*end,hit:!!hitObj};return}
  laserSound(false);beam=null;
  ship.fireT-=dt;if(!firing||ship.fireT>0)return;ship.fireT=s.cd/rm;const col=WEAPONS.find(w=>w.id===weapon).color;
  if(weapon==='blaster'){for(let i=0;i<s.n;i++){const o=i-(s.n-1)/2,a=ship.a+o*.07,px=-ny*o*6,py=nx*o*6;
      bullets.push({x:ox+px,y:oy+py,vx:Math.cos(a)*s.spd+ship.vx,vy:Math.sin(a)*s.spd+ship.vy,life:s.life,dmg:s.dmg*dm,col,k:'bolt'})}sfx.blaster()}
  else if(weapon==='scatter'){for(let i=0;i<s.n;i++){const a=ship.a+rand(-s.spread/2,s.spread/2),sp=s.spd*rand(.8,1.1);
      bullets.push({x:ox,y:oy,vx:Math.cos(a)*sp+ship.vx,vy:Math.sin(a)*sp+ship.vy,life:s.life*rand(.85,1.1),dmg:s.dmg*dm,col,k:'pellet'})}
    ship.vx-=nx*30;ship.vy-=ny*30;shake=Math.max(shake,2);sfx.scatter()}
  else if(weapon==='plasma'){bullets.push({x:ox,y:oy,vx:nx*s.spd+ship.vx,vy:ny*s.spd+ship.vy,life:1.4,dmg:s.dmg*dm,splash:s.splash*dm,rad:s.rad,col,k:'plasma'});sfx.plasma()}
  else if(weapon==='arc'){const hit=new Set();let cur=nearest(ox,oy,s.range,hit,ship.a),px=ox,py=oy;
    if(!cur){arcs.push({pts:jag(ox,oy,ox+nx*110+rand(-30,30),oy+ny*110+rand(-30,30)),life:.1,max:.1,col});sfx.arc();return}
    for(let i=0;i<=s.chain&&cur;i++){hit.add(cur);arcs.push({pts:jag(px,py,cur.x,cur.y),life:.14,max:.14,col});hitTarget(cur,s.dmg*dm*(i?.85:1),cur.x,cur.y);
      sparks(cur.x,cur.y,4,col,160);px=cur.x;py=cur.y;cur=nearest(px,py,170+L*12,hit)}sfx.arc()}
  addPart({k:'flash',x:ox,y:oy,vx:ship.vx,vy:ship.vy,life:.08,max:.08,size:18,color:col})}

function updateShip(dt){
  if(ship.dead){ship.respawn-=dt;if(ship.respawn<=0){if(lives<=0){gameOver();return}
    ship.dead=false;sfx.respawn();hull=S.hullMax;shield=S.shieldMax;ship.inv=3;ship.vx=ship.vy=0;ship.chill=0;[ship.x,ship.y]=spawnPos();cam.x=ship.x;cam.y=ship.y;
    asteroids.forEach(a=>{const d=Math.hypot(a.x-ship.x,a.y-ship.y)||1;if(d<a.r+150){a.vx+=(a.x-ship.x)/d*140;a.vy+=(a.y-ship.y)/d*140}})}return}
  ship.inv=Math.max(0,ship.inv-dt);ship.contactT-=dt;ship.lastHit+=dt;ship.shieldFlash=Math.max(0,ship.shieldFlash-dt*2.5);
  for(const k in ship.pu)ship.pu[k]=Math.max(0,ship.pu[k]-dt);ship.comboT-=dt;if(ship.comboT<=0)ship.combo=0;
  ship.chill=Math.max(0,ship.chill-dt);for(const f of frost){if((ship.x-f.x)**2+(ship.y-f.y)**2<f.r*f.r)ship.chill=Math.max(ship.chill,.25)}
  const chillMul=ship.chill>0?.58:1;
  if(ship.lastHit>2.2)shield=Math.min(S.shieldMax,shield+S.shieldRegen*dt);
  let ax=0,ay=0,thr=false,firing=false,aimA=null;
  if(keys.ArrowLeft||keys.KeyA)ship.a-=4.4*dt;if(keys.ArrowRight||keys.KeyD)ship.a+=4.4*dt;
  if(keys.ArrowUp||keys.KeyW){ax+=Math.cos(ship.a);ay+=Math.sin(ship.a);thr=true}
  if(keys.ArrowDown||keys.KeyS){ship.vx*=1-2.5*dt;ship.vy*=1-2.5*dt}
  if(keys.Space)firing=true;
  if(moveStick){const dx=moveStick.x-moveStick.ox,dy=moveStick.y-moveStick.oy,l=Math.hypot(dx,dy);if(l>6){const m=Math.min(1,l/60);ax+=dx/l*m;ay+=dy/l*m;thr=true;if(!aimStick)aimA=Math.atan2(dy,dx)}}
  if(aimStick){const dx=aimStick.x-aimStick.ox,dy=aimStick.y-aimStick.oy;if(Math.hypot(dx,dy)>8)aimA=Math.atan2(dy,dx);firing=true}
  if(mouse.down){aimA=Math.atan2(mouse.y-SH/2-(ship.y-cam.y)*ZOOM,mouse.x-SW/2-(ship.x-cam.x)*ZOOM);firing=true}
  if(clearT>=0)firing=false;
  if(aimA!==null)ship.a+=clamp(angDiff(ship.a,aimA),-11*dt,11*dt);
  ship.thrusting=thr;ship.vx+=ax*S.thrust*chillMul*dt;ship.vy+=ay*S.thrust*chillMul*dt;
  for(const h of holes){const dx=h.x-ship.x,dy=h.y-ship.y,d=Math.hypot(dx,dy);if(d<h.range){const f=420*Math.pow(1-d/h.range,1.6)+40;ship.vx+=dx/d*f*dt;ship.vy+=dy/d*f*dt;
    if(d<h.core+S.r){hurt(45*dt,true);ship.shieldFlash=1;if(Math.random()<.3)sparks(ship.x,ship.y,2,'#ffb347')}}}
  const sp=Math.hypot(ship.vx,ship.vy),mv=S.maxV*(holes.length?1.15:1)*chillMul;if(sp>mv){ship.vx*=mv/sp;ship.vy*=mv/sp}
  ship.vx*=1-.35*dt;ship.vy*=1-.35*dt;ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
  const lim=HALF-S.r;if(ship.x<-lim){ship.x=-lim;ship.vx=Math.abs(ship.vx)*.5}if(ship.x>lim){ship.x=lim;ship.vx=-Math.abs(ship.vx)*.5}
  if(ship.y<-lim){ship.y=-lim;ship.vy=Math.abs(ship.vy)*.5}if(ship.y>lim){ship.y=lim;ship.vy=-Math.abs(ship.vy)*.5}
  if(rig){const dx=ship.x-rig.x,dy=ship.y-rig.y,d=Math.hypot(dx,dy)||1,mn=rig.r+S.r;if(d<mn){ship.x=rig.x+dx/d*mn;ship.y=rig.y+dy/d*mn;const rel=ship.vx*dx/d+ship.vy*dy/d;if(rel<0){ship.vx-=1.5*rel*dx/d;ship.vy-=1.5*rel*dy/d}}}
  if(thr&&Math.random()<.9){const engs=S.sh.eng===2?[-S.sh.bw*.55,S.sh.bw*.55]:[0];const ey=pick(engs),ba=ship.a+Math.PI+rand(-.25,.25),
    bx=ship.x-Math.cos(ship.a)*14-Math.sin(ship.a)*ey,by=ship.y-Math.sin(ship.a)*14+Math.cos(ship.a)*ey;
    addPart({k:'spark',x:bx,y:by,vx:ship.vx+Math.cos(ba)*rand(120,220),vy:ship.vy+Math.sin(ba)*rand(120,220),life:rand(.15,.32),max:.32,size:rand(4,7),color:Math.random()<.6?'#ff9a3c':'#5ad1ff',drag:3})}
  fireWeapon(dt,firing);
  // missiles
  if(S.missileCd){ship.missT-=dt;if(ship.missT<=0){const tg=nearest(ship.x,ship.y,900);if(tg){ship.missT=S.missileCd;
    for(let i=0;i<S.missileN;i++){const a=ship.a+(i?1:-1)*1.4;const t2=i?nearest(ship.x,ship.y,900,new Set([tg]))||tg:tg;
      missiles.push({x:ship.x,y:ship.y,vx:ship.vx+Math.cos(a)*180,vy:ship.vy+Math.sin(a)*180,a,target:t2,life:4,dmg:(5+upg.missile*1.5)*S.dmgMul*S.missMul})}sfx.missile()}else ship.missT=.5}}
  // wingmen
  const wn=S.wing>=3?2:S.wing>=1?1:0;
  for(let i=0;i<wn;i++){const w=ship.wings[i],a=levelTime*1.7+i*Math.PI,tx=ship.x+Math.cos(a)*44,ty=ship.y+Math.sin(a)*44;
    if(w.x===0&&w.y===0){w.x=tx;w.y=ty}w.x+=(tx-w.x)*Math.min(1,8*dt);w.y+=(ty-w.y)*Math.min(1,8*dt);w.fireT-=dt;
    if(w.fireT<=0&&clearT<0){const t=nearest(w.x,w.y,430);if(t){w.fireT=(S.wing>=2?.42:.6);const aa=Math.atan2(t.y-w.y,t.x-w.x);
      bullets.push({x:w.x,y:w.y,vx:Math.cos(aa)*820,vy:Math.sin(aa)*820,life:.6,dmg:(S.wing>=2?1.4:.9)*S.dmgMul*(ship.pu.over>0?2:1)*(1+level*.02)*S.wingMul,col:'#9ff6ff',k:'bolt'});sfx.wing()}else w.fireT=.3}
    for(const o of ores){if(!o.dead&&(o.x-w.x)**2+(o.y-w.y)**2<24*24){o.dead=true;collectOre(o)}}}
}

// ================= update: world =================
function update(dt){
  levelTime+=dt;const playing=state==='play';
  if(ship&&playing)updateShip(dt);if(state!=='play'&&state!=='title')return;
  // bullets
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.k==='plasma'&&Math.random()<.6)addPart({k:'spark',x:b.x,y:b.y,vx:rand(-20,20),vy:rand(-20,20),life:.25,max:.25,size:6,color:'#9dff5a'});
    if(b.life<=0||Math.abs(b.x)>HALF||Math.abs(b.y)>HALF){b.dead=true;if(b.k==='plasma')plasmaBurst(b);continue}
    let hitO=null;
    for(const a of asteroids){if(a.dead)continue;const rr=a.r*.9;if((b.x-a.x)**2+(b.y-a.y)**2<rr*rr){hitO=a;break}}
    if(!hitO)for(const e of enemies){if(e.dead)continue;if((b.x-e.x)**2+(b.y-e.y)**2<e.r*e.r){hitO=e;break}}
    if(!hitO)for(const m of mines){if(!m.dead&&(b.x-m.x)**2+(b.y-m.y)**2<144){b.dead=true;detonateMine(m,true);break}}

function updateMission(dt){const n=level;

  else if(mission==='storm'){const W=storm;missionT-=dt;refillT-=dt;const f=clamp(1-missionT/W.total,0,1);
    W.r=W.r0+(W.r1-W.r0)*Math.min(1,f*1.15);W.cx=W.tx*f;W.cy=W.ty*f;
    W.out=!!(ship&&!ship.dead&&Math.hypot(ship.x-W.cx,ship.y-W.cy)>W.r);
    if(W.out){hurt((6+n*.25)*dt,true);ship.shieldFlash=Math.max(ship.shieldFlash,.5);if(Math.random()<dt*5)arcs.push({pts:jag(ship.x+rand(-60,60),ship.y+rand(-60,60),ship.x+rand(-60,60),ship.y+rand(-60,60)),life:.1,max:.1,col:'#c9b3ff'});if(!thr('stz',500))sfx.static()}

  musicUpdate();const flying=state==='play'&&ship&&!ship.dead;engineSound(flying&&ship.thrusting,flying?Math.hypot(ship.vx,ship.vy):0);

function parseCode(txt){txt=(txt||'').trim().replace(/\s+/g,'');if(txt.startsWith('ORS2:'))txt=txt.slice(5);
  const sv=JSON.parse(decodeURIComponent(escape(atob(txt))));if(!sv||sv.v!==2||typeof sv.level!=='number'||typeof sv.credits!=='number')throw new Error('bad');return sv}

function importCode(txt){let sv;try{sv=parseCode(txt)}catch(e){tmsg("That code doesn't look like an Ore Rush save.");return}
  if(sv.best&&sv.best>best){best=sv.best;store.set('orerush_best',best)}delete sv.best;store.set(SAVE,sv);loadGame(sv);sfx.buy();
  tmsg(`Loaded: sector ${sv.level}, ${fmt(sv.credits)} cr.`,true);const go=()=>showStation();
  setTimeout(async()=>{if(SC.token&&!SC.paused)await syncImportAsk();go()},900)}

ov.addEventListener('click',e=>{initAudio();const b=e.target.closest('button');if(!b||b.disabled)return;const D=b.dataset;
  const keepScroll=()=>{const p=ov.querySelector('.panel'),s=p?p.scrollTop:0;showShop();const p2=ov.querySelector('.panel');if(p2)p2.scrollTop=s};
  if(D.tab){shopTab=D.tab;sfx.click();showShop();return}
  if(D.buy){const u=UPG.find(x=>x.id===D.buy),c=upgCost(u,upg[D.buy]);if(credits>=c&&upg[D.buy]<u.max&&level>=(UPG_REQ[upg[D.buy]+1]||0)){credits-=c;const om=S.hullMax;upg[D.buy]++;computeStats();if(D.buy==='hull')hull+=S.hullMax-om;sfx.buy();saveGame();keepScroll()}return}
  if(D.wbuy){const w=WEAPONS.find(x=>x.id===D.wbuy);if(credits>=w.cost&&level>=(w.req||0)){credits-=w.cost;wl[w.id]=0;weapon=w.id;sfx.buy();saveGame();keepScroll()}return}
  if(D.wup){const w=WEAPONS.find(x=>x.id===D.wup),c=wUpCost(w,wl[w.id]);if(credits>=c&&wl[w.id]<5&&level>=WUP_REQ[wl[w.id]+1]){credits-=c;wl[w.id]++;sfx.buy();saveGame();keepScroll()}return}
  if(D.oc){const u=UPG.find(x=>x.id===D.oc),k=oc[u.id]||0,c=ocCost(u,k);if(upg[u.id]>=u.max&&credits>=c){credits-=c;const om=S.hullMax;oc[u.id]=k+1;computeStats();if(u.id==='hull')hull+=S.hullMax-om;sfx.buy();saveGame();keepScroll()}return}
  if(D.woc){const w=WEAPONS.find(x=>x.id===D.woc),key='w_'+w.id,k=oc[key]||0,c=wocCost(w,k);if(wl[w.id]>=5&&credits>=c){credits-=c;oc[key]=k+1;sfx.buy();saveGame();keepScroll()}return}
  if(D.deed){const sn=+D.deed,c=deedCost(sn),r=Math.floor((sn-1)/10);if(!deeds.includes(sn)&&cleared(sn)&&credits>=c){if(credits<c)return;credits-=c;deeds.push(sn);const om=S.hullMax;computeStats();hull+=Math.max(0,S.hullMax-om);
    regionOwned(r)?sfx.clear():sfx.buy();saveGame();keepScroll()}return}
  if(D.equip){weapon=D.equip;sfx.buy();saveGame();keepScroll();return}
  if(D.ship){const d=SHIPS.find(x=>x.id===D.ship);if(credits>=d.cost&&level>=(d.req||0)){credits-=d.cost;ownedShips.push(d.id);shipId=d.id;computeStats();hull=S.hullMax;sfx.buy();saveGame();keepScroll()}return}
