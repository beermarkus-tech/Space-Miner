// ================= cloud save sync =================
/* Cloud save: one game on all devices, via a private GitHub Gist. Same design as Frontier Works (js/sync.js), adapted to Ore Rush's save.
   Gist (found by its description GIST_DESC) files: orerush-save.txt (ORS2 save code), orerush-meta.json {ver,dev,name,time,level,score,stars,t},
   orerush-live.json {dev,name,time,closed} ("playing now"), orerush-backup.txt (the cloud save a forced upload replaced).
   Rules:
   - A device uploads only if the cloud still holds the version it started from (its base: SC.base = meta.ver, SC.baseDev = meta.dev).
   - "Played since the base" = the local save changed since then (SC.baseSig is a fingerprint of the save at the base).
   - Cloud newer + this device not played since its base → load automatically (a local copy is kept for "Undo last sync").
   - Both played, first connection to a non-empty cloud, or a cloud save that looks older (lower sector / score) → ask.
   - A normal upload never lowers the cloud's progress (e.g. after "New game"): ask instead.
   - Another device played in the last 3 minutes and didn't close → ask before taking over.
   - The losing game is always kept: forced upload → old cloud save in orerush-backup.txt; cloud load → local copy in PRESYNC.
   - After Undo or a "this device only" import, sync pauses; Resume asks which game to keep (as on first connection).
   - Questions and cloud loads wait until you're in a menu (never in the middle of a sector). The token stays in localStorage only. */
const SYNC_KEY='orerush_sync',PRESYNC='orerush_presync',GH='https://api.github.com',GIST_DESC=DEV?'Ore Rush DEV save (test version, managed by the game, do not edit)':'Ore Rush save (managed by the game, do not edit)';
const GF={save:'orerush-save.txt',meta:'orerush-meta.json',live:'orerush-live.json',backup:'orerush-backup.txt'};
const TOKEN_URL='https://github.com/settings/tokens/new?scopes=gist&description='+(DEV?'Ore%20Rush%20DEV':'Ore%20Rush');
const SY={st:'',busy:false,asking:false,hold:false,liveOk:false,lastBeat:0,ans:null,undo:!!store.get(PRESYNC),deferred:false,prev:'title'};
let SC=store.get(SYNC_KEY)||{};if(!SC.dev){SC.dev=Math.random().toString(36).slice(2,10);store.set(SYNC_KEY,SC)}
const scSave=()=>store.set(SYNC_KEY,SC);
function devGuess(){const u=navigator.userAgent;return /iPad|Tablet/i.test(u)||(/Android/i.test(u)&&!/Mobile/i.test(u))?'Tablet':/Mobi|iPhone|Android/i.test(u)?'Phone':'Computer'}
const syncAgo=t=>{const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?`${Math.round(s/60)} min ago`:s<86400?`${Math.round(s/3600)} h ago`:`${Math.round(s/86400)} days ago`};
const playStr=t=>{const m=Math.round((t||0)/60);return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`};
const rawSave=()=>{try{return localStorage.getItem(KP+SAVE)||''}catch(e){return ''}};
const sig=t=>{if(!t)return '';let h=5381;for(let i=0;i<t.length;i++)h=(h*33+t.charCodeAt(i))|0;return h.toString(36)+'.'+t.length};
function syncSum(){const sv=store.get(SAVE);return sv?{level:sv.level,score:sv.score||0,stars:Object.values(sv.stars||{}).reduce((a,b)=>a+b,0),t:Math.round(sv.playT||0)}:null}
const syncDirty=()=>!SC.base||sig(rawSave())!==SC.baseSig;
const syncIsBase=m=>!!SC.base&&m.ver===SC.base&&m.dev===SC.baseDev;
const progLess=(a,b)=>a.level<b.level||(a.level===b.level&&(a.score||0)<(b.score||0));   // a has less progress than b
const syncOlder=m=>{const s=syncSum();return !!s&&progLess(m,s)};
const canAsk=()=>['title','shop','brief','cloud','transfer','station','sysmap','galaxy'].includes(state);
async function gh(path,opt){opt=opt||{};const r=await fetch(GH+path,{method:opt.method||'GET',cache:'no-cache',body:opt.body,keepalive:!!opt.keepalive,
  headers:Object.assign({Authorization:'Bearer '+SC.token,Accept:'application/vnd.github+json'},opt.body?{'Content-Type':'application/json'}:{})});
  if(r.status===401||r.status===403)throw Object.assign(new Error('GitHub refused the key. Check that it has the “gist” permission.'),{auth:1});
  if(r.status===404)throw Object.assign(new Error('not found'),{nf:1});
  if(!r.ok)throw new Error('GitHub error '+r.status);return r.json()}
async function syncFile(f){if(!f)return null;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-cache'});return r.text()}return f.content}
async function cloudGet(){
  if(!SC.gist){const list=await gh('/gists?per_page=100');const g=list.find(g=>g.description===GIST_DESC);if(!g)return null;SC.gist=g.id;scSave()}
  let g;try{g=await gh('/gists/'+SC.gist)}catch(e){if(e.nf){SC.gist=null;SC.base=null;scSave();return null}throw e}
  const f=g.files||{},js=async n=>{const t=await syncFile(f[n]);try{return t?JSON.parse(t):null}catch(e){return null}};
  return{meta:await js(GF.meta),live:await js(GF.live),save:f[GF.save]}}
const liveFile=closed=>({content:JSON.stringify({dev:SC.dev,name:SC.name,time:Date.now(),closed:!!closed})});
async function cloudPut(c,force,closed,keepalive){
  const txt=saveCode();if(!txt)throw new Error('There is no saved game on this device yet');
  const ver=((c&&c.meta&&c.meta.ver)||0)+1,meta=Object.assign({ver,dev:SC.dev,name:SC.name,time:Date.now()},syncSum());
  const files={[GF.save]:{content:txt},[GF.meta]:{content:JSON.stringify(meta)},[GF.live]:liveFile(closed)};
  if(force&&c&&c.save){const old=await syncFile(c.save);if(old)files[GF.backup]={content:old}}
  if(SC.gist)await gh('/gists/'+SC.gist,{method:'PATCH',body:JSON.stringify({files}),keepalive});
  else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files})});SC.gist=g.id}
  SC.base=ver;SC.baseDev=SC.dev;SC.baseSig=sig(rawSave());SC.last=Date.now();scSave();SY.lastBeat=Date.now()}
async function cloudLoad(c){const txt=await syncFile(c.save);if(!txt)throw new Error('The cloud save is empty');
  const sv=parseCode(txt),cur=rawSave();if(cur){store.set(PRESYNC,{raw:cur,t:Date.now()});SY.undo=true}
  if(sv.best&&sv.best>best){best=sv.best;store.set('orerush_best',best)}delete sv.best;store.set(SAVE,sv);loadGame(sv);
  SC.base=c.meta.ver;SC.baseDev=c.meta.dev;SC.baseSig=sig(rawSave());SC.last=Date.now();scSave();if(canAsk()||state==='syncask')showTitle()}
/* small message at the bottom of the screen */
let toastT=0;function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),4200)}
/* questions: a promise that the dialog buttons resolve; afterwards the previous screen comes back */
function syncBack(){const s=SY.prev;s==='shop'?showShop():s==='brief'?showBrief(SY.briefLoc):s==='station'?showStation():s==='sysmap'?showSystem():s==='galaxy'?showGalaxy():s==='cloud'?showCloud():s==='transfer'?showTransfer(transferBack):showTitle()}
function syncAsk(html,noBack){SY.asking=true;if(state!=='syncask')SY.prev=state;state='syncask';showOv(html);
  return new Promise(res=>{SY.ans=v=>{SY.ans=null;SY.asking=false;if(!noBack)syncBack();res(v)}})}
const sumLine=(who,s,when)=>`<div class="syncside"><b>${who}</b><br>${s?`Sector ${s.level} · ${fmt(s.score)} cr total haul · ${s.stars}★ · ${playStr(s.t)} played`:'No saved game yet'}${when?`<br><span>${when}</span>`:''}</div>`;
async function syncConflict(c,why){const m=c.meta,loc=syncSum(),head={first:'A cloud save already exists',down:'The cloud save looks older',both:'Both devices have new progress',
    less:'This device has less progress than the cloud'}[why];
  const v=await syncAsk(`<h2>☁ ${head}</h2><p>Which game do you want to keep? The other one is kept as a backup.</p>
    ${sumLine('This device ('+(SC.name||'this device')+')',loc,SC.last?'last synced '+syncAgo(SC.last):'')}${sumLine('Cloud (from '+(m.name||'another device')+')',m,'saved '+syncAgo(m.time))}
    <div class="btns"><button class="btn" data-act="syncAns" data-v="local" ${loc?'':'disabled'}>Keep this device’s game</button>
    <button class="btn alt" data-act="syncAns" data-v="cloud">Use the cloud game</button><button class="btn alt" data-act="syncAns" data-v="later">Decide later</button></div>`);
  SY.busy=true;   // loading/uploading now: keep timed syncs out until syncNow's finally
  if(v==='local'){await cloudPut(c,true);toast('☁ This device’s game is now the cloud save (the old one is kept as a backup)')}
  else if(v==='cloud'){await cloudLoad(c);toast(`☁ Loaded the cloud game from ${m.name||'another device'}`)}
  else{SY.hold=true;SY.st='hold'}}
function syncStatus(){return SC.paused?'⏸ Paused on this device':SY.st==='busy'?'☁ Syncing…':SY.st==='offline'?'☁ Offline, will sync when online':
  SY.st==='hold'?'☁ Waiting for your decision (Sync now asks again)':SY.st==='wait'?'☁ Will finish syncing when you’re back in the menu':
  SY.st&&SY.st[0]==='⚠'?SY.st:SC.last?`☁ Synced ${syncAgo(SC.last)} · ${SC.name}`:'☁ Connected'}
function syncRedraw(){const el=document.getElementById('syncSt');if(el)el.textContent=SC.token?syncStatus():'Not connected';if(state==='cloud'&&SC.token)showCloud()}
function syncSt(s){SY.st=s;syncRedraw()}
async function syncNow(manual){
  if(!SC.token||SY.busy||SY.asking)return;if(SC.paused){if(manual)toast('Cloud sync is paused on this device');return}
  if(manual)SY.hold=false;if(SY.hold)return;
  SY.busy=true;syncSt('busy');
  try{const c=await cloudGet();
    if(!c||!c.meta){if(rawSave()){await cloudPut(c,false);toast('☁ Game saved to the cloud')}SC.last=Date.now();scSave();syncSt('ok');return}
    const m=c.meta,L=c.live;
    if(syncIsBase(m)){
      if(syncDirty()){const s=syncSum();
        if(s&&progLess(s,m)){if(!canAsk()){SY.deferred=true;syncSt('wait');return}SY.busy=false;await syncConflict(c,'less');if(SY.st!=='hold')syncSt('ok');return}
        if(s)await cloudPut(c,false)}
      else if(!document.hidden&&Date.now()-SY.lastBeat>120000){await gh('/gists/'+SC.gist,{method:'PATCH',body:JSON.stringify({files:{[GF.live]:liveFile(false)}})});SY.lastBeat=Date.now()}
      SC.last=Date.now();scSave();syncSt('ok');if(manual)toast('☁ Up to date');return}
    // the cloud changed (or this is the first connection): loading or asking happens only in a menu
    if(!canAsk()){SY.deferred=true;syncSt('wait');return}
    if(!SY.liveOk&&L&&L.dev!==SC.dev&&!L.closed&&Date.now()-L.time<180000){SY.busy=false;
      const go=await syncAsk(`<h2>☁ ${L.name||'Another device'} is playing</h2><p>Your ${L.name||'other device'} was playing ${syncAgo(L.time)}. Continue here anyway?
        If you do, close the game there first so both don’t change the same save.</p><div class="btns"><button class="btn" data-act="syncAns" data-v="1">Continue here</button><button class="btn alt" data-act="syncAns" data-v="">Not now</button></div>`);
      SY.busy=true;if(!go){SY.hold=true;syncSt('hold');return}SY.liveOk=true}
    SY.busy=false;
    if(!SC.base)await syncConflict(c,'first');
    else if(!syncDirty()){if(syncOlder(m))await syncConflict(c,'down');else{SY.busy=true;await cloudLoad(c);toast(`☁ Loaded newer game from ${m.name||'another device'} (sector ${m.level})`)}}
    else await syncConflict(c,'both');
    if(SY.st!=='hold')syncSt('ok');
  }catch(e){SY.asking=false;syncSt(e.auth?'⚠ '+e.message:(navigator.onLine===false||e instanceof TypeError)?'offline':'⚠ '+e.message)}
  finally{SY.busy=false;syncRedraw()}}
/* leaving the app: upload if changed, mark "closed" so the other device doesn't warn */
async function syncLeave(){if(!SC.token||SC.paused||SY.busy||SY.asking||SY.hold)return;
  try{SY.busy=true;const c=await cloudGet();if(c&&c.meta&&syncIsBase(c.meta)){const s=syncSum();
    if(syncDirty()&&s&&!progLess(s,c.meta))await cloudPut(c,false,true,true);
    else await gh('/gists/'+SC.gist,{method:'PATCH',body:JSON.stringify({files:{[GF.live]:liveFile(true)}}),keepalive:true})}}catch(e){}finally{SY.busy=false}}
/* the Cloud save screen (from the main menu) */
function showCloud(){state='cloud';
  if(!SC.token){showOv(`<h2>☁ Cloud save</h2><p>Keep one Ore Rush game on all your devices. Your save is stored in a private Gist on your own GitHub account.</p>
    <p style="font-size:13.5px;color:#93a8c6">You need a GitHub key that can only use Gists. Open <a href="${TOKEN_URL}" target="_blank" rel="noopener" style="color:#5ef0ff;word-break:break-all">${TOKEN_URL}</a>,
    sign in, set an expiration you like, keep only <b>gist</b> ticked, press <b>Generate token</b> and copy the key (it starts with ghp_). Use the same key on each device.</p>
    <div class="kicker" style="margin-top:12px">GITHUB KEY</div><input type="password" id="syncTok" class="code1" placeholder="ghp_…" autocomplete="off">
    <div class="kicker" style="margin-top:10px">NAME OF THIS DEVICE</div><input id="syncName" class="code1" value="${(SC.name||devGuess()).replace(/"/g,'')}">
    <div class="btns"><button class="btn" data-act="syncConnect">☁ Connect</button><button class="btn alt" data-act="menu">Back</button></div>
    <div class="help">The key is stored only on this device.</div>`);return}
  showOv(`<h2>☁ Cloud save</h2><div class="radio" style="border-color:#5ef0ff"><b style="color:#5ef0ff">STATUS</b><span id="syncSt">${syncStatus()}</span></div>
    <div class="btns"><button class="btn" data-act="syncNowBtn">☁ Sync now</button>
    ${SC.paused?'<button class="btn alt" data-act="syncResume">▶ Resume sync</button>':'<button class="btn alt" data-act="syncPause">⏸ Pause sync on this device</button>'}
    ${SY.undo?'<button class="btn alt" data-act="syncUndo">↶ Undo last sync</button>':''}<button class="btn alt" data-act="syncOff">Disconnect</button><button class="btn alt" data-act="menu">Back</button></div>
    <div class="help">This device: ${SC.name}. Syncing happens by itself when you open the game, every few minutes, and when you leave.</div>`)}
const SYNC_ACT={
  syncAns:D=>{if(SY.ans)SY.ans(D.v)},
  syncConnect:()=>{const t=(document.getElementById('syncTok').value||'').trim(),n=(document.getElementById('syncName').value||'').trim()||devGuess();if(!t)return toast('Paste your GitHub key first');
    Object.assign(SC,{token:t,name:n,base:null,baseDev:null,baseSig:null,paused:false,gist:null});scSave();SY.liveOk=false;SY.hold=false;showCloud();syncNow(true)},
  syncNowBtn:()=>{SY.liveOk=false;syncNow(true)},
  syncPause:()=>{SC.paused=true;scSave();showCloud();toast('Cloud sync paused on this device')},
  syncResume:()=>{SC.paused=false;SC.base=null;scSave();SY.hold=false;showCloud();syncNow(true)},     // after a pause we can't know which game is right: ask
  syncUndo:()=>{const r=store.get(PRESYNC);if(!r||!r.raw)return toast('Nothing to undo');try{localStorage.setItem(KP+SAVE,r.raw)}catch(e){}loadGame(JSON.parse(r.raw));store.del(PRESYNC);SY.undo=false;
    SC.paused=true;scSave();showCloud();toast('Restored the game from before the last sync. Sync is paused here; Resume asks which game to keep')},
  syncOff:()=>{SC={dev:SC.dev};scSave();SY.st='';SY.hold=false;showCloud();toast('Disconnected from the cloud save (the Gist stays on GitHub)')}};
/* import: all devices or only here */
async function syncImportAsk(){if(!SC.token||SC.paused)return;
  const v=await syncAsk(`<h2>☁ Use this save everywhere?</h2><p>You loaded a save. Should it replace the cloud game, so your other devices get it too? (The current cloud game is kept as a backup.)</p>
    <div class="btns"><button class="btn" data-act="syncAns" data-v="all">All devices</button><button class="btn alt" data-act="syncAns" data-v="here">Only this device (pause sync here)</button></div>`,true);
  if(v==='all'){try{SY.busy=true;const c=await cloudGet();await cloudPut(c,true);toast('☁ This save is now the cloud game')}catch(e){toast('⚠ Cloud upload failed: '+e.message)}finally{SY.busy=false}}
  else{SC.paused=true;scSave();toast('Sync paused on this device')}}
/* automatic: on start, when coming back to the app, every 3 minutes, when going online, soon after each save; on leaving */
let syncSoonT=0,SYNC_SOON_MS=4000;function syncSoon(){if(!SC.token||SC.paused)return;clearTimeout(syncSoonT);syncSoonT=setTimeout(()=>syncNow(false),SYNC_SOON_MS)}
function syncBoot(){if(SC.token)setTimeout(()=>syncNow(false),1200)}

document.addEventListener('visibilitychange',()=>{if(!SC.token)return;if(document.hidden)syncLeave();else{SY.liveOk=false;SY.hold=false;syncNow(false)}});

// ================= PWA =================
// Drop the offline cache and service worker, then load the page fresh from the server (your save is kept).
async function reloadLatest(btn){if(btn){btn.disabled=true;btn.textContent='Loading latest version…'}
  try{if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
