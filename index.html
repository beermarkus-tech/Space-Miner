    ctx.fillStyle=hexA(col,.35);ctx.beginPath();ctx.arc(st.ox+dx*c,st.oy+dy*c,24,0,TAU);ctx.fill()};
  if(moveStick)drawStick(moveStick,'#5ef0ff');if(aimStick)drawStick(aimStick,'#ff8a3d');
  if(isTouch&&!moveStick){ctx.strokeStyle='rgba(94,240,255,.1)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(80,SH-130,50,0,TAU);ctx.stroke()}
  if(isTouch&&!aimStick){ctx.strokeStyle='rgba(255,138,61,.12)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(SW-80,SH-130,50,0,TAU);ctx.stroke()}}

// ================= loop =================
let last=performance.now();
function frame(now){const dt=Math.min(1/30,(now-last)/1000);last=now;
  try{
  if(state==='play'){update(dt);if(ship&&!ship.dead){const tx=ship.x+ship.vx*.25,ty=ship.y+ship.vy*.25;cam.x+=(tx-cam.x)*Math.min(1,5*dt);cam.y+=(ty-cam.y)*Math.min(1,5*dt)}}
  else if(state==='title'){update(dt);cam.x+=dt*25;cam.y+=dt*10}
  if(state!=='pause')updateFx(dt);
  musicUpdate();const flying=state==='play'&&ship&&!ship.dead;engineSound(flying&&ship.thrusting,flying?Math.hypot(ship.vx,ship.vy):0);
  if(flying&&clearT<0&&failT<0&&hull<S.hullMax*.25&&!thr('low',1300))sfx.lowHull();
  const mx=Math.max(0,HALF-SW/2/ZOOM+60),my=Math.max(0,HALF-SH/2/ZOOM+60);if(state!=='title'){cam.x=clamp(cam.x,-mx,mx);cam.y=clamp(cam.y,-my,my)}
  render(now)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}

// ================= overlays =================
const ov=document.getElementById('ov');
function showOv(html){ov.innerHTML=`<div class="panel">${html}</div>`;ov.classList.add('show');ov.querySelector('.panel').scrollTop=0;document.body.classList.remove('playing','paused');laserSound(false)}
function hideOv(){ov.classList.remove('show');ov.innerHTML='';document.body.classList.remove('paused')}
const totalStars=()=>Object.values(stars).reduce((s,v)=>s+v,0);
function showTitle(){state='title';level=Math.max(1,level);setupField(2+Math.floor(Math.random()*3),false);const sv=store.get(SAVE);
  showOv(`<h1>ORE RUSH</h1><div class="sub">DEEP-SPACE MINING</div>
  <p style="text-align:center">Blast asteroids, grab the ore, fight pirates, and build up your ship across 40 sectors and four regions. After that, the Endless Deep.</p>
  <div class="btns">${sv?`<button class="btn" data-act="continue">Continue · Sector ${sv.level}${sv.stars?` · ${Object.values(sv.stars).reduce((s,v)=>s+v,0)}★`:''}</button>`:''}<button class="btn ${sv?'alt':''}" data-act="new">New game</button><button class="btn alt" data-act="transfer">Transfer save (export / import)</button>${installEvt?'<button class="btn alt" data-act="install">Install as app</button>':''}</div>
  <div class="help"><b>Phone:</b> left thumb flies, right thumb aims &amp; fires, buttons at the bottom switch weapon / fire a nova<br>
  <b>Keyboard:</b> arrows / WASD fly · Space fires · Q/E or 1–5 switch weapons · B nova · P pause<br><b>Mouse:</b> hold to aim &amp; fire at the cursor<br><b>♪ button:</b> music + sound → sound only → silent${canVibe?' · <b>📳</b> vibration on / off':''}
  ${best?`<br><br>Best haul: <span class="credits">${fmt(best)} cr</span>`:''}</div>`)}
function showBrief(){state='brief';setupField(level,false);const o=objFor(level),R=REGIONS[regionOf(level)];
  showOv(`<div class="kicker">${R.name.toUpperCase()}${stars[level]?' · BEST '+'★'.repeat(stars[level]):''}</div><h2>Sector ${level}</h2><div class="radio"><b>DISPATCH</b>${briefFor(level)}</div>
  <div class="obj"><span class="ic">${o[0]}</span><div><b>${o[1]}</b>${o[2]}</div></div>
  <div class="rows"><span>Credits</span><span class="v credits">${fmt(credits)} cr</span><span>Hull</span><span class="v" style="color:${hull<S.hullMax*.5?'#ff7a5a':'inherit'}">${Math.round(hull)} / ${S.hullMax}</span>
  <span>Ships · Novas</span><span class="v">${lives} · ${bombs}</span><span>Weapon</span><span class="v">${WEAPONS.find(w=>w.id===weapon).name} ${wl[weapon]+1}</span></div>
  <div class="btns"><button class="btn" data-act="launch">Launch</button><button class="btn alt" data-act="shop">Shipyard</button></div>`)}
function endLevel(){state='summary';const st=levelStats,n=level;let star=1;if(st.deaths===0)star++;if(!st.damaged)star++;
  const starBonus=(star-1)*15*n;let missionBonus=0;
  if(mission==='quota')missionBonus=150+n*20+Math.round(missionT*5);if(mission==='defend')missionBonus=Math.round((200+n*25)*(.5+.5*rig.hp/rig.maxhp));
  if(mission==='escort')missionBonus=Math.round((260+n*30)*(.5+.5*rig.hp/rig.maxhp));if(mission==='storm')missionBonus=180+n*24;if(mission==='lode')missionBonus=120+n*18;
  credits+=starBonus+missionBonus;score+=starBonus+missionBonus;const prevStars=stars[n]||0;stars[n]=Math.max(prevStars,star);
  const oreSum=TYPE_KEYS.reduce((s,k)=>s+st.oreVal[k],0);
  const rows=TYPE_KEYS.filter(k=>st.ore[k]).map(k=>`<span><i class="dot" style="background:${TYPES[k].ore};box-shadow:0 0 8px ${TYPES[k].ore}"></i>${TYPES[k].name} × ${st.ore[k]}</span><span class="v">${fmt(st.oreVal[k])}</span>`).join('');
  const finale=n===LAST_SECTOR,mid=n===30;level++;saveGame();for(let i=0;i<star;i++)sfx.star(i);
  showOv(`<div class="kicker">${REGIONS[regionOf(n)].name.toUpperCase()}</div><h2>Sector ${n} complete</h2>
  <div class="stars">${[0,1,2].map(i=>`<span class="${i<star?'on':'off'}">★</span>`).join('')}</div>
  <div class="starlist">★ Complete &nbsp;·&nbsp; ★ No ships lost &nbsp;·&nbsp; ★ No hull damage</div>
  ${mid?`<div class="radio"><b>DISPATCH</b>The flagship is scrap and the belt is ours. But long-range scans picked up something cold and huge out in the Frozen Halo. Gear up.</div>`:''}
  ${finale?`<div class="radio"><b>DISPATCH</b>You did it. The Frozen Halo is ours. The Endless Deep lies beyond, with harder sectors and richer rock for as long as you last.</div>`:''}
  <div class="rows">${rows||'<span>No ore recovered</span><span></span>'}
  ${st.bonus?`<span>Bounty</span><span class="v">${fmt(st.bonus)}</span>`:''}${missionBonus?`<span>Mission bonus</span><span class="v">${fmt(missionBonus)}</span>`:''}
  ${starBonus?`<span>Star bonus</span><span class="v">${fmt(starBonus)}</span>`:''}
  <span class="total">Earned</span><span class="v total credits">${fmt(oreSum+st.bonus+missionBonus+starBonus)} cr</span>
  ${stolen?`<span>Ore stolen by scavengers</span><span class="v" style="color:#ff7a5a">${stolen}</span>`:''}
  <span>Asteroids broken</span><span class="v">${st.rocks}</span>${st.kills?`<span>Pirates destroyed</span><span class="v">${st.kills}</span>`:''}</div>
  <div class="btns"><button class="btn" data-act="shop">To the shipyard</button></div>`)}
function showFail(){state='failed';saveGameKeepLevel();
  showOv(`<h2 style="color:#ff7a5a">Sector ${level} failed</h2><p>${failReason} You keep everything you collected.</p>
  <div class="btns"><button class="btn" data-act="launch">Retry sector</button><button class="btn alt" data-act="shop">Shipyard</button></div>`)}
function saveGameKeepLevel(){saveGame()}
function gameOver(){state='over';sfx.over();if(score>best){best=score;store.set('orerush_best',best)}const claim=Math.floor(credits*.3);
  showOv(`<h2 style="color:#ff7a5a">Fleet lost</h2><p>Your last ship went down in sector ${level}.</p>
  <div class="rows"><span>Total haul</span><span class="v credits">${fmt(score)} cr</span><span>Best haul</span><span class="v">${fmt(best)} cr</span></div>
  <p>File an insurance claim to get 3 new ships and retry this sector. The insurer keeps 30% of your credits (${fmt(claim)} cr). Your upgrades stay.</p>
  <div class="btns"><button class="btn warn" data-act="insure">Insurance claim · retry sector ${level}</button><button class="btn alt" data-act="new">Start a new game</button></div>`)}
function pauseGame(){if(state!=='play')return;state='pause';moveStick=aimStick=null;mouse.down=false;
  showOv(`<h2>Paused</h2><div class="btns"><button class="btn" data-act="resume">Resume</button><button class="btn alt" data-act="quit">Abandon sector &amp; quit</button></div><div class="help">Quitting returns you to your last save, at the start of this sector.</div>`);document.body.classList.add('paused')}
function resumeGame(){hideOv();state='play';last=performance.now();document.body.classList.add('playing')}


let transferBack='title';
function saveCode(){const sv=store.get(SAVE);if(!sv)return '';sv.best=best;return 'ORS2:'+btoa(unescape(encodeURIComponent(JSON.stringify(sv))))}
function parseCode(txt){txt=(txt||'').trim().replace(/\s+/g,'');if(txt.startsWith('ORS2:'))txt=txt.slice(5);
  const sv=JSON.parse(decodeURIComponent(escape(atob(txt))));if(!sv||sv.v!==2||typeof sv.level!=='number'||typeof sv.credits!=='number')throw new Error('bad');return sv}
function showTransfer(from){transferBack=from;if(from==='shop')saveGame();state='transfer';const c=saveCode();
  showOv(`<h2>Transfer save</h2>
  <p>Copy your save code here, then paste it into Ore Rush on another device, browser, or a downloaded copy of the game.</p>
  <div class="kicker" style="margin-top:12px">YOUR SAVE CODE</div>
  ${c?`<textarea class="code" id="exCode" readonly>${c}</textarea>
  <div class="row2"><button class="btn" data-act="copycode">Copy code</button><button class="btn alt" data-act="dlsave">Download save file</button></div>`:'<p style="color:#93a8c6">No save yet. Finish a sector first.</p>'}
  <div class="kicker" style="margin-top:18px">LOAD A SAVE</div>
  <textarea class="code" id="imCode" placeholder="Paste a save code here"></textarea>
  <div class="row2"><button class="btn" data-act="loadcode">Load code</button><label class="btn alt" style="text-align:center">Open save file<input type="file" id="imFile" accept=".txt,text/plain" hidden></label></div>
  <div class="msg" id="tmsg"></div>
  <div class="btns"><button class="btn alt" data-act="tback">Back</button></div>`);
  const f=document.getElementById('imFile');f.addEventListener('change',()=>{const file=f.files[0];if(!file)return;file.text().then(t=>{document.getElementById('imCode').value=t.trim();importCode(t)})});
  const ex=document.getElementById('exCode');if(ex)ex.addEventListener('focus',()=>ex.select())}
function tmsg(t,ok){const m=document.getElementById('tmsg');if(m){m.textContent=t;m.style.color=ok?'#7dff7a':'#ff7a5a'}}
function importCode(txt){let sv;try{sv=parseCode(txt)}catch(e){tmsg("That code doesn't look like an Ore Rush save.");return}
  if(sv.best&&sv.best>best){best=sv.best;store.set('orerush_best',best)}delete sv.best;store.set(SAVE,sv);loadGame(sv);sfx.buy();
  tmsg(`Loaded: sector ${sv.level}, ${fmt(sv.credits)} cr.`,true);setTimeout(()=>{level>1?showShop():showBrief()},900)}

const shipImgCache={};
function shipImg(d){if(shipImgCache[d.id])return shipImgCache[d.id];const c=document.createElement('canvas');c.width=200;c.height=150;const g=c.getContext('2d');
  g.translate(100,82);g.scale(2.6,2.6);g.rotate(-Math.PI/2);drawShipBody(g,d,false);return shipImgCache[d.id]=c.toDataURL()}
function pips(l,max){return `<div class="pips">${Array.from({length:max},(_,i)=>`<i class="pip ${i<l?'on':''}"></i>`).join('')}</div>`}
function showShop(){state='shop';computeStats();const n=level;let cards='';
  if(shopTab==='weapons'){for(const w of WEAPONS){const L=wl[w.id],own=L>=0,eq=weapon===w.id;
    let btns='';if(!own)btns=`<button data-wbuy="${w.id}" ${credits<w.cost?'disabled':''}>Buy · ${fmt(w.cost)} cr</button>`;
    else{const c=wUpCost(w,L);btns=`<button data-wup="${w.id}" ${L>=5||credits<c?'disabled':''}>${L>=5?'Maxed':'Upgrade · '+fmt(c)}</button>`+(eq?'':`<button class="eqb" data-equip="${w.id}">Equip</button>`)}
    cards+=`<div class="card ${eq?'eq':''}"><div class="ct"><i class="dot" style="background:${w.color};box-shadow:0 0 8px ${w.color};margin:0"></i>${w.name}${eq?' <span style="color:#5ef0ff;font-size:10px">EQUIPPED</span>':''}</div>
      ${own?pips(L+1,6):''}<div class="cd">${w.desc}</div><div class="stat">${wdesc(w.id,Math.max(0,L))}${own&&L<5?' → next: '+wdesc(w.id,L+1):''}</div><div class="bb">${btns}</div></div>`}}
  else if(shopTab==='systems'){for(const u of UPG){const l=upg[u.id],c=upgCost(u,l),mx=l>=u.max;
    cards+=`<div class="card"><div class="ct">${u.name}</div>${pips(l,u.max)}<div class="cd">${u.desc}</div><div class="stat">${sysDesc(u.id,l)}${mx?'':' → '+sysDesc(u.id,l+1)}</div>
    <div class="bb"><button data-buy="${u.id}" ${mx||credits<c?'disabled':''}>${mx?'Maxed':fmt(c)+' cr'}</button></div></div>`}}
  else if(shopTab==='ships'){const mxv={hull:2.1,shield:1.8,speed:1.3,dmg:1.5};
    for(const d of SHIPS){const own=ownedShips.includes(d.id),cur=shipId===d.id;
      const sb=['hull','shield','speed','dmg'].map(k=>`<span>${{hull:'Hull',shield:'Shield',speed:'Speed',dmg:'Damage'}[k]}</span><i style="width:${Math.round(d[k]/mxv[k]*100)}%"></i>`).join('');
      cards+=`<div class="card ${cur?'eq':''}"><img src="${shipImg(d)}" alt=""><div class="ct">${d.name}${cur?' <span style="color:#5ef0ff;font-size:10px">FLYING</span>':''}</div><div class="cd">${d.desc}</div><div class="sbar">${sb}</div>
      <div class="bb">${cur?'<button disabled>Current ship</button>':own?`<button class="eqb" data-fly="${d.id}">Fly this ship</button>`:`<button data-ship="${d.id}" ${credits<d.cost?'disabled':''}>Buy · ${fmt(d.cost)} cr</button>`}</div></div>`}}
  else{const miss=Math.ceil(S.hullMax-hull),rep=Math.ceil(miss*1.4),lifeCost=400+n*60,novaCost=220+n*15;
    cards+=`<div class="card ${miss>S.hullMax*.3?'warn':''}"><div class="ct">Hull Repair</div><div class="cd">Hull at ${Math.round(hull)} / ${S.hullMax}.</div><div class="bb"><button data-act="repair" ${miss<=0||credits<=0?'disabled':''}>${miss<=0?'Fully repaired':(credits>=rep?'Repair · '+fmt(rep)+' cr':'Repair what you can')}</button></div></div>`;
    cards+=`<div class="card"><div class="ct">Spare Ship</div><div class="cd">An extra life. You have ${lives} (max 5).</div><div class="bb"><button data-act="life" ${lives>=5||credits<lifeCost?'disabled':''}>${lives>=5?'Max':fmt(lifeCost)+' cr'}</button></div></div>`;
    cards+=`<div class="card"><div class="ct">Nova Bomb</div><div class="cd">Shockwave that wrecks everything nearby and clears enemy fire. You have ${bombs} (max 5).</div><div class="bb"><button data-act="nova" ${bombs>=5||credits<novaCost?'disabled':''}>${bombs>=5?'Max':fmt(novaCost)+' cr'}</button></div></div>`}
  const miss=hull<S.hullMax*.7;
  showOv(`<div class="shophead"><h2 style="margin:0">Shipyard</h2><span class="credits" style="font-size:20px">${fmt(credits)} cr</span></div>
  <div class="tabs">${[['weapons','Weapons'],['systems','Systems'],['ships','Ships'],['services','Services'+(miss?' ⚠':'')]].map(([k,l])=>`<button data-tab="${k}" class="${shopTab===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="grid">${cards}</div>
  <div class="btns"><button class="btn" data-act="next">Continue to sector ${level}</button><button class="btn alt" data-act="transfer">Transfer save (export / import)</button><button class="btn alt" data-act="menu">Save &amp; quit to menu</button></div>`)}

ov.addEventListener('click',e=>{initAudio();const b=e.target.closest('button');if(!b||b.disabled)return;const D=b.dataset;
  const keepScroll=()=>{const p=ov.querySelector('.panel'),s=p?p.scrollTop:0;showShop();const p2=ov.querySelector('.panel');if(p2)p2.scrollTop=s};
  if(D.tab){shopTab=D.tab;sfx.click();showShop();return}
  if(D.buy){const u=UPG.find(x=>x.id===D.buy),c=upgCost(u,upg[D.buy]);if(credits>=c&&upg[D.buy]<u.max){credits-=c;const om=S.hullMax;upg[D.buy]++;computeStats();if(D.buy==='hull')hull+=S.hullMax-om;sfx.buy();saveGame();keepScroll()}return}
  if(D.wbuy){const w=WEAPONS.find(x=>x.id===D.wbuy);if(credits>=w.cost){credits-=w.cost;wl[w.id]=0;weapon=w.id;sfx.buy();saveGame();keepScroll()}return}
  if(D.wup){const w=WEAPONS.find(x=>x.id===D.wup),c=wUpCost(w,wl[w.id]);if(credits>=c&&wl[w.id]<5){credits-=c;wl[w.id]++;sfx.buy();saveGame();keepScroll()}return}
  if(D.equip){weapon=D.equip;sfx.buy();saveGame();keepScroll();return}
  if(D.ship){const d=SHIPS.find(x=>x.id===D.ship);if(credits>=d.cost){credits-=d.cost;ownedShips.push(d.id);shipId=d.id;computeStats();hull=S.hullMax;sfx.buy();saveGame();keepScroll()}return}
  if(D.fly){const ratio=hull/S.hullMax;shipId=D.fly;computeStats();hull=Math.round(S.hullMax*ratio);sfx.buy();saveGame();keepScroll();return}
  const act=D.act;if(['new','continue','shop','next','tback','resume','quit','menu','transfer'].includes(act))sfx.click();
  if(act==='new'){resetProgress();store.del(SAVE);showBrief()}
  else if(act==='continue'){const sv=store.get(SAVE);if(!sv)return showTitle();loadGame(sv);level>1?showShop():showBrief()}
  else if(act==='launch')startLevel();
  else if(act==='shop')showShop();
  else if(act==='next'){saveGame();showBrief()}
  else if(act==='repair'){const miss=S.hullMax-hull,rep=Math.ceil(miss*1.4);if(credits>=rep){credits-=rep;hull=S.hullMax}else{hull+=credits/1.4;credits=0}sfx.buy();saveGame();keepScroll()}
  else if(act==='life'){const c=400+level*60;if(credits>=c&&lives<5){credits-=c;lives++;sfx.buy();saveGame();keepScroll()}}
  else if(act==='nova'){const c=220+level*15;if(credits>=c&&bombs<5){credits-=c;bombs++;sfx.buy();saveGame();keepScroll()}}
  else if(act==='insure'){credits=Math.floor(credits*.7);lives=3;computeStats();hull=S.hullMax;saveGame();showBrief()}
  else if(act==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;if(state==='title')showTitle()})}}
  else if(act==='transfer')showTransfer(state==='shop'?'shop':'title');
  else if(act==='tback'){transferBack==='shop'?showShop():showTitle()}
  else if(act==='copycode'){const ta=document.getElementById('exCode');const c=ta.value;
    const fallback=()=>{ta.focus();ta.select();try{document.execCommand('copy');tmsg('Copied.',true)}catch(e){tmsg('Select the code and copy it by hand.')}};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(()=>tmsg('Copied to clipboard.',true),fallback);else fallback()}
  else if(act==='dlsave'){const fname='ore-rush-save-sector'+((store.get(SAVE)||{}).level||1)+'.txt',data=saveCode();
    const blobDl=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();tmsg('Save file downloaded.',true)}catch(e){tmsg('Downloads are blocked here. Use Copy code instead.')}};
    if(window.claude&&window.claude.use){tmsg('Preparing file…',true);window.claude.use('downloads').then(dl=>{if(!dl)return blobDl();return dl.save({filename:fname,data}).then(()=>tmsg('Save file downloaded.',true),()=>tmsg('Download cancelled. You can use Copy code instead.'))}).catch(blobDl)}
    else blobDl()}
  else if(act==='loadcode')importCode(document.getElementById('imCode').value);
  else if(act==='resume')resumeGame();
  else if(act==='quit')showTitle();
  else if(act==='menu'){if(state==='shop')saveGame();showTitle()}});

document.getElementById('pauseBtn').addEventListener('click',()=>{initAudio();state==='play'?pauseGame():state==='pause'&&resumeGame()});
const muteBtn=document.getElementById('muteBtn');const SND_LABEL=['Music and sound on','Sound effects only (music off)','All sound off'];
const setMuteUI=()=>{muteBtn.style.opacity=sndMode===2?.4:1;muteBtn.textContent=['♪','FX','✕'][sndMode];muteBtn.style.fontSize=sndMode===1?'12px':'';muteBtn.title=SND_LABEL[sndMode];muteBtn.setAttribute('aria-label',SND_LABEL[sndMode])};
muteBtn.addEventListener('click',()=>{initAudio();sndMode=(sndMode+1)%3;store.set('orerush_sound',sndMode);store.set('orerush_muted',sndMode===2);mus.duck=null;applySound();setMuteUI();if(sndMode<2)sfx.click()});
const vibeBtn=document.getElementById('vibeBtn');const setVibeUI=()=>{vibeBtn.style.display=canVibe?'':'none';vibeBtn.textContent=vibeOn?'📳':'📴';vibeBtn.style.opacity=vibeOn?1:.45;
  const l=vibeOn?'Vibration on':'Vibration off';vibeBtn.title=l;vibeBtn.setAttribute('aria-label',l)};
vibeBtn.addEventListener('click',()=>{vibeOn=!vibeOn;store.set('orerush_vibe',vibeOn);setVibeUI();if(vibeOn)try{navigator.vibrate(40)}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();if(AC)AC.suspend()}else if(AC)AC.resume()});
// browsers only allow sound after a tap or key press, so start audio (and the title music) on the first one
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);


// ================= PWA =================
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(state==='title')showTitle()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
resize();setMuteUI();setVibeUI();resetProgress();showTitle();requestAnimationFrame(frame);
</script>
